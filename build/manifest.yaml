      specCapabilities:
        - catalog-browsing
    canvas:
      problem: "Shoppers need to browse categories, products and items and search by keyword in their own locale."
      solution: "Build locale-filtered paged listings, single lookups, keyword search and the catalog data model with its indexes."
      userStories:
        - "As a shopper, I want to browse categories, products and items, so that I can find a pet to buy."
        - "As a shopper, I want to search by keyword, so that I can find items quickly."
      acceptanceCriteria:
        - "Catalog entity hierarchy and categories \u2014 Localised category: details are keyed by category and locale and the name is required"
        - "Keyword search \u2014 Search: matching entries are returned for the keywords"
        - "Out-of-range paging \u2014 Paging beyond the list: handled without error"
        - "Data store failure \u2014 Store unavailable: the failure is reported"
      outOfScope:
        - "Add-to-cart behaviour"
        - "Catalog population batch load"
      risksAssumptions: []
      techStack: []
      affectedCode: []
