        - "Sufficient stock is reduced \u2014 Sufficient stock: stock is reduced and the line is marked shipped"
        - "COMPLETED only when all lines shipped \u2014 Partly shipped order: it is not COMPLETED"
        - "Inventory screen \u2014 Stock clerk update: only ticked items change"
