<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Site shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--brand:#4f46e5;--on-brand:#fff;--danger:#dc2626;--warning:#d97706;--success:#16a34a;--info:#0284c7;--bg:#fff;--paper:#f8fafc;--text:#0f172a;--muted:#64748b;--divider:#e2e8f0;--brand-soft:color-mix(in srgb,var(--brand) 8%,#fff);--danger-soft:color-mix(in srgb,var(--danger) 8%,#fff)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:20px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{flex-shrink:0;display:block}
.brand{height:64px;display:flex;align-items:center;gap:8px;padding:0 16px;font-weight:600;font-size:16px;cursor:pointer}
.brand .mark{width:32px;height:32px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.nav{padding:8px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.grp{font-size:12px;line-height:16px;font-weight:600;color:var(--muted);padding:16px 8px 8px;letter-spacing:.02em}
.grp:first-child{padding-top:4px}
.item{display:flex;align-items:center;gap:12px;height:48px;padding:0 12px;border-radius:4px;color:var(--text);cursor:pointer}
.item .ic{color:var(--muted)}
.item:hover{background:#eef2f7}
.item[aria-current=page]{background:var(--brand);color:var(--on-brand);font-weight:500}
.item[aria-current=page] .ic{color:var(--on-brand)}
.item .lbl{flex:1;min-width:0;line-height:18px}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--brand);color:var(--on-brand);font-size:12px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.item[aria-current=page] .count{background:var(--on-brand);color:var(--brand)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:4px;border:1px solid transparent;font-weight:500;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:color-mix(in srgb,var(--brand) 88%,#000)}
.btn.secondary{background:var(--bg);border-color:var(--divider);color:var(--text)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-soft)}
.crumbs{display:flex;align-items:center;gap:4px;font-size:12px;line-height:16px;color:var(--muted);margin-bottom:8px}
.crumbs a{cursor:pointer}.crumbs a:hover{color:var(--brand)}
.crumbs [aria-current]{color:var(--text)}
.ph h1{font-size:22px;line-height:28px;font-weight:600;margin:0;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--muted)}
.card{border:1px solid var(--divider);border-radius:8px;background:var(--bg)}
.foot{padding:16px;border-top:1px solid var(--divider);font-size:12px;line-height:16px;color:var(--muted)}
.skel{background:linear-gradient(90deg,#eef2f7 0%,#f8fafc 50%,#eef2f7 100%);background-size:200% 100%;animation:sh 1.4s linear infinite;border-radius:4px}
@keyframes sh{to{background-position:-200% 0}}
.srow{height:40px;display:flex;align-items:center;gap:16px;padding:0 16px;border-top:1px solid var(--divider)}
.srow:first-child{border-top:0}
.app{display:flex;flex-direction:column;min-height:100vh}
.content{flex:1;padding:16px;display:flex;flex-direction:column;gap:16px}
.mtop{height:56px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--divider);position:sticky;top:0;background:var(--bg);z-index:3}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:4px;cursor:pointer;color:var(--text);border:0;background:transparent}
.iconbtn:hover{background:var(--paper)}
.mlang{position:relative;display:flex;align-items:center}
.mlang select{appearance:none;-webkit-appearance:none;height:36px;border:1px solid var(--divider);border-radius:4px;background:var(--paper);padding:0 10px 0 30px;font:inherit;font-size:13px;color:var(--text)}
.mlang .ic{position:absolute;left:8px;color:var(--muted);pointer-events:none}
.mtop .btn{height:36px;padding:0 12px;font-size:13px}
#nav{position:absolute;opacity:0;pointer-events:none}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.drawer{position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--paper);border-right:1px solid var(--divider);transform:translateX(-100%);transition:transform .2s;z-index:10;display:flex;flex-direction:column}
#nav:checked~.scrim{opacity:1;pointer-events:auto}
#nav:checked~.drawer{transform:none}
.drawer .brand{justify-content:space-between;padding-right:8px}
</style></head><body><div class="app"><input type="checkbox" id="nav" aria-label="Menu"><label for="nav" class="scrim" aria-hidden="true"></label>

4 1l-1 7h-13"/></svg><span class="lbl">Cart</span><span class="count" aria-label="2 distinct items">2</span></a><div class="grp">Account</div><a class="item" href="#"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg><span class="lbl">Sign on</span></a><div class="grp">Operations</div><a class="item" href="#" data-goto="Error state · Mobile"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M5 17h-2v-11a1 1 0 0 1 1-1h9v12m-4 0h6m4 0h2v-6h-8m0-5h5l3 5"/></svg><span class="lbl">Order fulfilment and invoicing</span></a><div class="grp">Admin</div><a class="item" href="#"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1-8.5 15a12 12 0 0 1-8.5-15a12 12 0 0 0 8.5-3"/><path d="M9 12l2 2l4-4"/></svg><span class="lbl">Administration of orders</span></a></nav></aside>
<header class="mtop"><label for="nav" class="iconbtn" aria-label="Open the menu" role="button"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></label>
<div class="mlang"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/></svg><select aria-label="Language"><option lang="en">EN</option><option lang="ja">日本語</option><option lang="zh">中文</option></select></div>
<div class="sp"></div><button class="btn ghost">Sign on</button><button class="btn primary">Create account</button></header>
<main class="content"><div class="ph"><nav class="crumbs" aria-label="Breadcrumb"><a href="#" data-goto="Site shell · Mobile">Catalog &amp; search</a><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6l-6 6"/></svg><span aria-current="page">Dogs</span></nav><h1>Dogs</h1><p>Products in this category.</p></div><div class="card" aria-busy="true"><div role="status" aria-live="polite" style="position:absolute;left:-9999px">Loading products…</div><div class="srow"><div class="skel" style="width:96px;height:12px"></div><div class="skel" style="flex:1;max-width:320px;height:12px"></div></div><div class="srow"><div class="skel" style="width:96px;height:12px"></div><div class="skel" style="flex:1;max-width:260px;height:12px"></div></div><div class="srow"><div class="skel" style="width:96px;height:12px"></div><div class="skel" style="flex:1;max-width:380px;height:12px"></div></div><div class="srow"><div class="skel" style="width:96px;height:12px"></div><div class="skel" style="flex:1;max-width:220px;height:12px"></div></div><div class="srow"><div class="skel" style="width:96px;height:12px"></div><div class="skel" style="flex:1;max-width:300px;height:12px"></div></div><div class="srow"><div class="skel" style="width:96px;height:12px"></div><div class="skel" style="flex:1;max-width:340px;height:12px"></div></div><div class="srow"><div class="skel" style="width:96px;height:12px"></div><div class="skel" style="flex:1;max-width:240px;height:12px"></div></div></div></main><footer class="foot">© 2026 Pet Store</footer></div></body></html>
