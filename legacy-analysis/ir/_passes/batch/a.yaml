  - capability_key: batch-operations
    record_keys: [BATCH-BRULE-0002]
    severity: medium
    category: other
    title: Extract-before-purge is only a scheduler dependency, and extract covers one day
    description: >
      The documented guarantee that no order is deleted before being extracted relies on the Control-M condition alone; the extract only exports yesterday's orders, so orders that reach COMPLETED or DENIED more than one day after creation and are purged later may never have been exported with their final status.
