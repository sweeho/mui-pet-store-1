    title: Catalog check and inventory report failures (code 8) raise no alert
    description: >
      Only exit code 4 mails the catalog team; a failed first-load request ends with code 8 and no notification. Likewise the inventory report and purge jobs have no failure mail action, unlike backup, extract and health check.
