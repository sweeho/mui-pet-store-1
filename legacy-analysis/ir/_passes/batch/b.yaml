    stack_metadata:
      batch.trigger: "Control-M PS_PETSTORE_CYCLIC PS_HEALTH_CHECK, every 10 minutes"
    traces:
      - path: legacy-source/batch/ps_health_check.sh
        line_start: 8
        line_end: 15
        excerpt: |
          for URL in "$PS_STORE_URL/main.screen" "$PS_OPC_URL/EntityCatalog.jsp" "$PS_SUPPLIER_URL/" "$PS_ADMIN_URL/"; do
            CODE=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$URL")
            if [ "$CODE" != "200" ]; then
          [ "$BAD" -eq 0 ] || exit 8
      - path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
        line_start: 101
        line_end: 101
        excerpt: 'TIMEFROM="0000" WEEKDAYS="ALL" TIMETO="2359" CYCLIC="1" CYCLIC_TYPE="Interval" INTERVAL="00010M" IND_CYCLIC="START"'
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        anchor: p1 (3.7 PS_HEALTH_CHECK)
        excerpt: "Exit code 8 when any does not answer HTTP 200; Control-M mails ps-ops."

  - record_key: BATCH-RULE-0010
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      The system SHALL give every batch job exit code 0 for success, 4 when a report or check found something to act on (stuck orders, bad
      catalog data) and 8 for a SQL, file or HTTP error, and SHALL write a time-stamped start and end line per job to the batch log.
    confidence: medium
    confidence_basis: >
      Codes are visible in each script and tabulated in the runbook; no single shared definition exists in code.
    risk_class: operational
    basis: exit statements across batch scripts and ps_log helper.
    plain_text: >
      Batch jobs report "all fine", "something needs attention" or "technical failure" in a consistent way, and every run is logged.
    technical_note: >
      conf/env.sh ps_log appends to $PS_LOG_DIR/batch.log; ps_ij returns failure when output contains a line starting ERROR.
    interface: false
    stack_metadata:
      batch.trigger: "all Control-M jobs"
    traces:
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        anchor: p1 (4. Exit codes and recovery)
        excerpt: "4A report or check found something: stuck orders (PS_ORDER_AGING_REPORT) or bad catalog data (PS_CATALOG_CHECK) ... 8SQL, file or HTTP error"
      - path: legacy-source/conf/env.sh
        line_start: 26
        line_end: 33
        excerpt: |
          ps_ij() {
            out=$("$JAVA_CMD" -cp "$DERBY_LIB/derbytools.jar:$DERBY_LIB/derbyclient.jar" \
          echo "$out" | grep -q "^ERROR" && return 1

suspected_defects:
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0004, BATCH-REQ-0002]
    severity: high
    category: contradicts-document
    title: Purge safety check "every order has been extracted first" is not enforced by what the extract covers
    description: >
      The purge SQL comment and runbook say no order is deleted before it is extracted. The extract only exports the previous day's orders, and
      the purge depends only on the extract job succeeding that day. An order that was missed on its own extract day (job failed, held after a
      backup failure, or order date outside the window) and later turns 180 days old is deleted without ever having been exported.
    traces:
      - path: legacy-source/db/batch/order_purge.sql
        line_start: 2
        line_end: 2
        excerpt: "-- Runs only after PS_ORDER_EXTRACT so every order has been extracted first."
      - path: legacy-source/db/batch/order_extract.sql
        line_start: 10
        line_end: 10
        excerpt: "    WHERE p.po_date >= :LO_MS AND p.po_date < :HI_MS"
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        anchor: p1 (3.5 PS_ORDER_PURGE)
        excerpt: "It waits for that day's extract so no order is deleted before it is extracted."
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0004]
    severity: medium
    category: data-corruption
    title: Purge uses inner join on contact information, so orders without it are never purged
    description: >
      Selection joins contact_info with an inner join. A COMPLETED or DENIED order with no matching contact record (or whose contact has no
      address row used for the address id) is never selected, so it and its card data stay indefinitely, contrary to the stated 180-day retention.
      Conversely, address and credit card rows are deleted by id without checking whether other orders reference the same rows.
    traces:
      - path: legacy-source/db/batch/order_purge.sql
        line_start: 10
        line_end: 15
        excerpt: |
          INSERT INTO session.purge_po
            SELECT p.po_id, p.contact_id, p.card_id, c.address_id
              FROM purchase_order p
              JOIN order_manager m ON m.order_id = p.po_id
              JOIN contact_info c ON c.contact_id = p.contact_id
             WHERE m.status IN ('COMPLETED', 'DENIED') AND p.po_date < :CUTOFF_MS;
  - capability_key: catalog-browsing
    record_keys: [BATCH-REQ-0007, BATCH-REQ-0008]
    severity: medium
    category: error-swallowed
    title: Catalog check ignores database errors other than missing tables
    description: >
      The script captures ij output with command substitution and never tests ps_ij's failure return. Any SQL error other than one containing
      "does not exist" (connection refused, permission, syntax) produces no C1-C5 line, so the job logs "end OK" and exits 0 although no check ran.
    traces:
      - path: legacy-source/batch/ps_catalog_check.sh
        line_start: 9
        line_end: 20
        excerpt: |
          OUT=$(ps_ij "$PS_SQL/catalog_check.sql")
          if echo "$OUT" | grep -qE "^C[1-5] "; then
            exit 4
          fi
          ps_log "end OK"
  - capability_key: catalog-browsing
    record_keys: [BATCH-REQ-0007]
    severity: low
    category: other
    title: Check C4 locale list is a comment, the query derives locales from category descriptions
    description: >
      The comment says C4 covers en_US, ja_JP and zh_CN. The query compares item descriptions against whatever locales exist in
      category_details for the item's category, so a locale missing from category_details is not checked, and a locale beyond the three would be.
    traces:
      - path: legacy-source/db/batch/catalog_check.sql
        line_start: 11
        line_end: 14
        excerpt: |
          -- C4: items missing a description for a locale the store serves (en_US, ja_JP, zh_CN)
          SELECT 'C4' AS chk, i.itemid, l.locale FROM item i, category_details l
           WHERE l.catid = (SELECT p.catid FROM product p WHERE p.productid = i.productid)
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0001]
    severity: low
    category: other
    title: Backup destination is hard-coded in SQL while the script's folder is configurable
    description: >
      db_backup.sql writes to /var/petstore/backup, but the script moves and prunes folders under PS_BACKUP_DIR. Overriding PS_BACKUP_DIR
      makes the move fail (backup reported failed) or prune the wrong folder. The script also deletes the previous undated backup and any
      same-day backup before the new one is confirmed, so a failed rerun leaves no backup for that day.
    traces:
      - path: legacy-source/db/batch/db_backup.sql
        line_start: 3
        line_end: 3
        excerpt: "CALL SYSCS_UTIL.SYSCS_BACKUP_DATABASE('/var/petstore/backup');"
      - path: legacy-source/batch/ps_db_backup.sh
        line_start: 7
        line_end: 10
        excerpt: |
          rm -rf "$PS_BACKUP_DIR/PetStoreDB"
          rm -rf "$PS_BACKUP_DIR/PetStoreDB_$STAMP"
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0009, BATCH-REQ-0008]
    severity: low
    category: contradicts-document
    title: Default host name in batch settings (psl-app01) differs from the documented node (ps-app01)
    description: >
      env.sh defaults the module URLs to host psl-app01; the runbook and scheduler use ps-app01. Unless overridden by environment, health check
      and populate requests go to a different host than documented.
    traces:
      - path: legacy-source/conf/env.sh
        line_start: 10
        line_end: 10
        excerpt: "PS_STORE_URL=${PS_STORE_URL:-http://psl-app01:8000/petstore}"
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        anchor: p1 (3.6 PS_CATALOG_CHECK)
        excerpt: "it calls http://ps-app01:8000/petstore/Populate?forcefully=false"
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0006]
    severity: low
    category: other
    title: Inventory report silently omits items with no English description
    description: >
      The report inner-joins item_details on locale en_US, so a low-stock item lacking an English description is not listed, while the totals line
      still counts it.
    traces:
      - path: legacy-source/db/batch/inventory_report.sql
        line_start: 6
        line_end: 6
        excerpt: "  JOIN item_details d ON d.itemid = i.item_id AND d.locale = 'en_US'"
  - capability_key: batch-operations
