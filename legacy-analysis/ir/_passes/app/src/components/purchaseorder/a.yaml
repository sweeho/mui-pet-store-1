  - capability_key: order-fulfilment
    record_keys: [ORDF-BR-0005]
    severity: medium
    category: data-corruption
    title: Shipping address is replaced by billing address on read
    description: >
      Only one contact record is stored (built from the shipping info), and on read it is returned as both
      billing and shipping. A distinct billing address supplied at order time is not persisted by this component.
    traces:
      - path: legacy-source/app/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 218
        line_end: 218
