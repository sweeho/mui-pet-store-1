    kind: entity
    capability_key: checkout-and-payment
    requirement: >
      The system SHALL represent a postal address as six text fields: street line 1, street line 2, city, state, zip code and country.
    confidence: high
    confidence_basis: >
      The field set appears in the value class, the entity bean abstract getters, the ejb-jar cmp-field list and the DTD; the DTD differs only on optionality.
    risk_class: operational
    basis: >
      Six persistent fields are declared; no length, format or mandatory constraint exists in the component. Capability filed under checkout-and-payment (billing/shipping address) as the closest listed key.
    plain_text: >
      An address consists of two street lines, a city, a state, a zip code and a country.
    technical_note: >
      Address value object plus container-managed entity bean AddressEJB with CMP fields; no validation in the component.
    interface: false
