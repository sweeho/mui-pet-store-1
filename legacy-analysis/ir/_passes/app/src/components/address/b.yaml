  - record_key: CHK-REQ-0006
    kind: requirement
    capability_key: checkout-and-payment
    requirement: >
      The system SHALL delete an order's addresses when the order is purged by the weekly purge of completed and denied orders older than 180 days.
    confidence: low
    confidence_basis: >
      Taken only from the runbook; the purge code is outside this module and was not read here.
    risk_class: regulated
    basis: >
      Runbook lists addresses among data removed with purged orders.
    plain_text: >
      Addresses are removed together with an old completed or denied order.
    technical_note: >
      Purge job PS_ORDER_PURGE; address bean's ejbRemove is empty.
    interface: false
    traces:
