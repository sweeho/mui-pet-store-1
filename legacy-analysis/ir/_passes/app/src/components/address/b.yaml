suspected_defects:
  - capability_key: checkout-and-payment
    record_keys: [CHK-REQ-0003, CHK-REQ-0004]
    severity: low
    category: other
    title: DTD marks country optional but parser requires it
    description: >
      The DTD declares Country optional, but fromDOM looks for the country element as mandatory, so a DTD-valid document without Country is rejected.
    traces:
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 38
