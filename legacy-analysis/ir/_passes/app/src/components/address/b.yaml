  - record_key: CHK-REQ-0005
    kind: requirement
    capability_key: checkout-and-payment
    requirement: >
      The system SHALL allow any caller to read, create, change and remove addresses without role restriction within the component.
    confidence: medium
    confidence_basis: >
      One clear place (ejb-jar method-permission unchecked); caller-level security not visible in this module.
    risk_class: regulated
    basis: >
      All bean methods are listed under unchecked permission; address data is personal data.
    plain_text: >
      The address component itself does not limit who may view or change an address; protection must come from the calling screens.
    technical_note: >
      ejb-jar method-permission unchecked on local and local-home interfaces; local interfaces only, so not remotely reachable.
