  - record_key: CART-REQ-0002
    kind: requirement
    capability_key: shopping-cart
    requirement: The system SHALL, when an item is added to the cart, set that item's quantity to 1 (or to the supplied quantity), replacing any quantity already present rather than adding to it.
    plain_text: Adding an item puts it in the cart with quantity one (or a given quantity); adding it again does not increase the quantity.
    technical_note: addItem calls cart.put, which overwrites. No validation of the quantity argument, so zero or negative quantities can be stored through addItem(id, qty).
    confidence: medium
    confidence_basis: One clear place in code; overwrite semantics are inferred from HashMap.put, not documented.
    risk_class: operational
    basis: addItem overloads.
    interface: false
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 117
        excerpt: |
          public void addItem (String itemID) {
              cart.put(itemID, new Integer(1));
          }
          public void addItem (String itemID,int qty) {
              cart.put(itemID, new Integer(qty));
          }
