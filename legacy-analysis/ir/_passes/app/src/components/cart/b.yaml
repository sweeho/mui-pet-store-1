  - record_key: CART-REQ-0008
    kind: requirement
    capability_key: shopping-cart
    requirement: GIVEN a cart item whose catalog lookup fails WHEN cart lines are built THEN the system SHALL omit that item from the displayed lines and subtotal and continue without reporting an error to the shopper.
    plain_text: If an item can no longer be found in the catalog, it silently disappears from the cart view and total.
    technical_note: CatalogException is caught and printed to stdout; the entry remains in the underlying map.
    confidence: medium
    confidence_basis: One clear place; user-visible consequence inferred.
    risk_class: financial
    basis: catch block in getItems.
    interface: false
    traces:
