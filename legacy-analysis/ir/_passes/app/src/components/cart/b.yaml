  - record_key: CART-BR-0003
    kind: business-rule
    capability_key: shopping-cart
    requirement: GIVEN a cart line WHEN its quantity is updated to a value of zero or less THEN the system SHALL remove the line; otherwise it SHALL set the quantity to the new value.
    plain_text: Setting a quantity to zero or below removes the item from the cart.
    technical_note: updateItemQuantity removes the key, then re-puts only if newQty > 0. Updating an item not in the cart with a positive quantity adds it.
    confidence: high
    confidence_basis: Explicit code plus a comment stating the rule.
    risk_class: operational
    basis: Code and comment.
    interface: false
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              // remove item if it is less than or equal to 0
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }
    stack_metadata:
      ejb.bean: ShoppingCartEJB
