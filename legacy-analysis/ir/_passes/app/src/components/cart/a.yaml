  - record_key: shopping-cart-REQ-0004
    kind: requirement
    capability_key: shopping-cart
    requirement: The system SHALL let a shopper add an item to the cart from the catalog and proceed to check out.
    confidence: low
    confidence_basis: Only the user guide describes it; no code in this module.
    risk_class: presentational
    basis: User guide walkthrough of Add to Cart then Check Out.
    plain_text: A shopper adds a product to the cart and then checks out.
    technical_note: Screens are outside this module.
    traces:
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: To buy a bulldog
        excerpt: |
          2. Click Add to Cart in the row of the Male Adult Bulldog.
          3. Click Check Out.
