suspected_defects:
  - capability_key: checkout-and-payment
    record_keys: [CHK-REQ-0002, CHK-REQ-0004]
    severity: low
    category: other
    title: Address-less contact can be created by the explicit-address overload and then fail on read
    description: >
      The explicit-address create path accepts any address reference, including null, and getData dereferences the address without a check, so a contact without an address fails when read.
    traces:
      - path: legacy-source/app/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 103
        line_end: 137
findings:
  - kind: ambiguity
    path: legacy-source/app/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
    description: >
      The no-argument ejbCreate and the (ContactInfo) ejbCreate do not store the address in ejbCreate; the post-create does. No field validation (required, format, length) exists in this module; any validation is elsewhere. No document under legacy-analysis/sources mentions contact info.
