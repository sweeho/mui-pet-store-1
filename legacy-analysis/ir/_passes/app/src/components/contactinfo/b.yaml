    requirement: >
      The system SHALL hold a contact record made of given name, family name, telephone, email and exactly one associated postal address.
    confidence: high
    confidence_basis: >
      Stated in the bean's field accessors, the deployment descriptor's persistent fields and the DTD content model; three places agree on the four text fields.
    risk_class: operational
    basis: >
      Abstract CMP accessors for four text fields plus a relationship to an address; descriptor lists the same four fields and a local reference to the Address bean; DTD lists FamilyName, GivenName, Address, Email, Phone.
    plain_text: >
      A contact consists of a given name, a family name, a phone number, an email address and one postal address.
    technical_note: >
      Container-managed entity bean ContactInfoEJB (CMP 2.x) with a container-managed relationship to AddressEJB. No length, format or mandatory constraints are declared anywhere in this module.
