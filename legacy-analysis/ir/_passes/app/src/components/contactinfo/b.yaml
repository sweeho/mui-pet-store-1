  - record_key: CHK-BR-0001
    kind: business-rule
    capability_key: checkout-and-payment
    requirement: >
      GIVEN the address service cannot be located WHEN a contact is created without a supplied address THEN the system SHALL fail the creation with an error stating that the address lookup failed.
    confidence: medium
    confidence_basis: >
      One clear place (two identical catch blocks); the error text is the only statement of the rule.
    risk_class: operational
    basis: >
      ServiceLocatorException is converted to CreateException "ContactInfoEJB error: ServiceLocator exception looking up address" in both address-creating post-create methods.
    plain_text: >
      If the address facility is unavailable when a contact is being created, the contact is not created and an error is reported.
    technical_note: >
      Catch block in ejbPostCreate() and ejbPostCreate(ContactInfo); transaction rolls back via CreateException.
    interface: false
    traces:
      - path: legacy-source/app/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 89
        line_end: 91
        excerpt: |
          } catch (ServiceLocatorException ne) {
            throw new CreateException("ContactInfoEJB error: ServiceLocator exception looking up address");
          }
    stack_metadata:
      framework: EJB 2.x CMP
  - record_key: CHK-REQ-0004
    kind: requirement
    capability_key: checkout-and-payment
    requirement: >
      The system SHALL return a contact's given name, family name, phone, email and address details as a single data object on request.
    confidence: medium
    confidence_basis: >
      One clear place; the DTD gives a second, XML-form view of the same shape but is not itself enforcement.
    risk_class: operational
    basis: >
      getData() builds a ContactInfo from the stored fields and the address's own data. The DTD defines an XML form with FamilyName, GivenName, Address, Email, Phone.
    plain_text: >
      Other parts of the system can read a contact's full details, including its address, in one piece.
    technical_note: >
      getData() on ContactInfoEJB; getAddress().getData() would throw a null pointer if no address were attached. The DTD is a separate XML interchange form.
    interface: true
    traces:
      - path: legacy-source/app/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 129
        line_end: 136
        excerpt: |
          public ContactInfo getData() {
            ContactInfo contactInfo = new ContactInfo();
            contactInfo.setGivenName(getGivenName());
            contactInfo.setFamilyName(getFamilyName());
            contactInfo.setPhone(getTelephone());
            contactInfo.setEmail(getEmail());
            contactInfo.setAddress(getAddress().getData());
            return contactInfo;
          }
      - path: legacy-source/app/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/rsrc/schemas/ContactInfo.dtd
        line_start: 41
        line_end: 43
        excerpt: |
          <!ELEMENT ContactInfo (FamilyName, GivenName, Address, Email, Phone)>
          <!ELEMENT FamilyName (#PCDATA)>
          <!ELEMENT GivenName (#PCDATA)>
    stack_metadata:
      framework: EJB 2.x CMP
      ejb.bean: ContactInfoEJB
findings:
