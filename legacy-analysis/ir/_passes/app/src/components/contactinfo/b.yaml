  - record_key: CHK-REQ-0001
    kind: requirement
    capability_key: checkout-and-payment
    requirement: >
      The system SHALL, when a contact is created from supplied given name, family name, telephone, email and address, store those values and link the supplied address to the contact.
    confidence: medium
    confidence_basis: >
      One clear place (the parameterised create method pair); no caller in this module was examined, so how often the path is used is not known.
    risk_class: operational
    basis: >
      ejbCreate copies four fields; ejbPostCreate attaches the passed AddressLocal.
    plain_text: >
      A contact can be created from a name, phone, email and an already existing address, and it keeps that address.
    technical_note: >
      ejbCreate(givenName, familyName, telephone, email, address) / ejbPostCreate with same signature. Note the address is linked by reference, not copied.
    interface: false
    traces:
      - path: legacy-source/app/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 93
        line_end: 106
        excerpt: |
          public Object ejbCreate(String givenName, String familyName,
                                  String telephone, String email, AddressLocal address)
                                  throws CreateException {
            setGivenName(givenName);
            setFamilyName(familyName);
            setTelephone(telephone);
            setEmail(email);
            return null;
          }

          public void ejbPostCreate(String givenName, String familyName,
                                    String telephone, String email,
                                    AddressLocal address) throws CreateException {
            setAddress(address);
          }
    stack_metadata:
      framework: EJB 2.x CMP
      ejb.bean: ContactInfoEJB
  - record_key: CHK-REQ-0002
    kind: requirement
    capability_key: checkout-and-payment
    requirement: >
      The system SHALL, when a contact is created from a contact data object, store its given name, family name, phone and email and create a new address record from the data object's address.
    confidence: medium
    confidence_basis: >
      One clear place; the copy-in behaviour is plain in code with no second source.
    risk_class: operational
    basis: >
      ejbCreate(ContactInfo) copies four fields; ejbPostCreate(ContactInfo) creates a new Address via the address home from contactInfo.getAddress().
    plain_text: >
      A contact can be created from a bundle of contact details, and a fresh address record is made from the address inside it.
    technical_note: >
      Address home looked up through ServiceLocator with JNDI name JNDINames.ADDR_EJB. Data-object phone maps to the telephone field.
    interface: false
    traces:
      - path: legacy-source/app/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 109
        line_end: 126
        excerpt: |
          public Object ejbCreate(ContactInfo contactInfo) throws CreateException {
            setGivenName(contactInfo.getGivenName());
            setFamilyName(contactInfo.getFamilyName());
            setTelephone(contactInfo.getPhone());
            setEmail(contactInfo.getEmail());
            return null;
          }

          public void ejbPostCreate(ContactInfo contactInfo) throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              AddressLocalHome adh = (AddressLocalHome)
                  serviceLocator.getLocalHome(JNDINames.ADDR_EJB);
              AddressLocal address = adh.create(contactInfo.getAddress());
              setAddress(address);
    stack_metadata:
      framework: EJB 2.x CMP
      ejb.bean: ContactInfoEJB
  - record_key: CHK-REQ-0003
    kind: requirement
    capability_key: checkout-and-payment
    requirement: >
      The system SHALL, when a contact is created with no data, create it with an empty address record attached.
    confidence: medium
