    path: legacy-source/app/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
    description: >
      No validation of any contact field (format of email or phone, mandatory values) exists in this module; whether such rules live in the web tier was not examined here. No document in legacy-analysis/sources mentions this module. Capability filed as checkout-and-payment (billing/shipping contact) as closest fit; customer accounts may also use it.
