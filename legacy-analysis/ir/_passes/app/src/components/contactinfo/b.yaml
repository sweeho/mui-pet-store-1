      One clear place; reachability of the no-argument create was not checked.
    risk_class: operational
    basis: >
      No-argument ejbCreate does nothing; ejbPostCreate() creates a blank address and attaches it.
    plain_text: >
      A blank contact can be created; it automatically gets an empty address to be filled in later.
    technical_note: >
      ejbPostCreate() calls adh.create() on the address home.
