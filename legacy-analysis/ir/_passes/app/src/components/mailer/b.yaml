  - record_key: ONOT-RULE-0002
    kind: business-rule
    capability_key: order-notifications
    requirement: >
      The system SHALL send the mail body as HTML, with the sender taken from the mail session default, the recipients parsed from the address field (non-strict, so several addresses are allowed), the subject as given, the current date as sent date and an X-Mailer header of "JavaMailer".
    confidence: medium
    confidence_basis: >
      One clear place (MailHelper); no test or document states the format.
    risk_class: operational
    basis: >
      Content type is the literal text/html; the content is not transformed or localised, it is assumed pre-formatted by the sender.
    plain_text: >
      Every notification e-mail goes out as an HTML message from the store's configured sender address to the recipient(s) named, stamped with the sending date.
    technical_note: >
      MailHelper.createAndSendMail looks up java:comp/env/mail/MailSession (JNDINames.MAIL_SESSION; resource-ref in ejb-jar.xml), msg.setFrom() with no argument, InternetAddress.parse(addr,false). Locale parameter is accepted but unused.
    interface: true
    traces:
