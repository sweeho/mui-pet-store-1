  - record_key: ONOT-RULE-0003
    kind: business-rule
    capability_key: order-notifications
    requirement: >
      GIVEN a mail cannot be sent (for example no mail server is configured), WHEN the mail request is processed, THEN the system SHALL log the failure and discard the request without retry and without failing the queue transaction; GIVEN the request is not valid mail XML or the message is not readable, THEN the system SHALL raise a container error so the message is not silently consumed.
    confidence: high
    confidence_basis: >
      Explicit in catch blocks with a comment explaining the intent, plus the error path in MailHelper.
    risk_class: operational
    basis: >
      Send failures become MailerAppException, which is caught and ignored in the listener; XML and JMS exceptions are rethrown as EJBException.
    plain_text: >
      If an e-mail cannot be sent, for instance because no mail server is set up, the notification is quietly dropped and the order carries on. Malformed mail requests are treated as errors.
    technical_note: >
      MailerMDB.onMessage catch MailerAppException with empty body ("ignore since user probably forgot to set up mail server"). XMLDocumentException and JMSException wrapped in EJBException, which under Required transaction lets the container roll back/redeliver. MailHelper prints to System.err only.
    interface: true
    traces:
      - path: legacy-source/app/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 83
        line_end: 90
        excerpt: |
          } catch (MailerAppException me) {
            //throw new EJBException("MailerMDB.onMessage" + me);
            //ignore since user probably forgot to set up mail server
          } catch (XMLDocumentException xde) {
            throw new EJBException("MailerMDB.onMessage" + xde);
          } catch(JMSException je) {
            throw new EJBException("MailerMDB.onMessage" + je);
      - path: legacy-source/app/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 86
        line_end: 89
        excerpt: |
          } catch (Exception e) {
              System.err.print("createAndSendMail exception : " + e);
              throw new MailerAppException("Failure while sending mail");
          }
    stack_metadata:
      ejb.bean: MailerMDB
      ejb.transaction: Required
  - record_key: ONOT-ENT-0004
    kind: entity
    capability_key: order-notifications
    requirement: >
      The system SHALL represent a mail request as a document with exactly three text parts in order: address, subject, content, and SHALL validate incoming requests against that structure.
    confidence: high
    confidence_basis: >
      DTD plus validating parse in code (VALIDATING flag) and ordered sibling lookup in fromDOM.
    risk_class: operational
    basis: >
      DTD defines Mail(Address, Subject, Content); fromDOM reads them in that order and rejects a root other than Mail.
    plain_text: >
      A mail request always has a recipient, a subject and a body, in that order; anything else is rejected.
    technical_note: >
      Mail.java toDOM/fromDOM, fromXML(String) uses validating=true. Format is the wire contract with producers (OPC notification beans).
    interface: true
    traces:
      - path: legacy-source/app/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
        line_start: 160
        line_end: 170
        excerpt: |
          if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_MAIL)) {
            ...
            mail.address = ... getFirstChild(element, XML_ADDRESS, false) ...
            mail.subject = ... getNextSibling(child, XML_SUBJECT, false) ...
            mail.content = ... getNextSibling(child, XML_CONTENT, false) ...
            return mail;
          }
          throw new XMLDocumentException(XML_MAIL + " element expected.");
      - path: legacy-source/app/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/rsrc/schemas/Mail.dtd
        line_start: 38
        line_end: 38
        excerpt: |
          <!ELEMENT Mail (Address, Subject, Content)>
    stack_metadata:
      framework: DTD/DOM
  - record_key: ONOT-REQ-0005
    kind: requirement
    capability_key: order-notifications
    requirement: >
      GIVEN notifications are not enabled by the administrator, WHEN an order changes status, THEN the system SHALL NOT send status e-mail; the mailer itself SHALL send whatever it is given.
    confidence: low
    confidence_basis: >
      The enablement switch is documented in the guides and lives in another module (OPC); nothing in this module reads it. Only inferred here from the documents.
    risk_class: operational
    basis: >
      Mailer has no enable check; the administration guide says notifications are off by default and enabled via OPC env-entries.
    plain_text: >
      Order status e-mails are off unless an administrator turns them on; once a request reaches the mailer it is always sent.
    technical_note: >
      The gating is in the OPC notification beans (env-entries SendApprovalMail, SendConfirmationMail, SendCompletedOrderMail), outside this module. Mail server host/from/user set in the OPC sun-j2ee-ri.xml.
    interface: false
    traces:
