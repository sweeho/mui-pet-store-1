records:
  - record_key: ONOT-INT-0001
    kind: integration
    capability_key: order-notifications
    requirement: >
      The system SHALL consume mail requests from a message queue, each carrying a recipient address, a subject and a content body, and send each as an e-mail.
    confidence: high
    confidence_basis: >
      Enforced by the message-driven bean, declared in the deployment descriptor as a queue listener, and the message shape is fixed by the DTD (code plus config plus schema).
    risk_class: operational
    basis: >
      The listener parses the queue text message as a Mail XML document and calls the sender with address, subject and content. The mail document DTD has exactly Address, Subject, Content.
    plain_text: >
      Mail requests placed on the mail queue by other parts of the store are picked up and sent out as e-mails to the named recipient with the given subject and text.
    technical_note: >
      MailerMDB.onMessage casts to TextMessage, Mail.fromXML (validating), then MailHelper.createAndSendMail. Queue destination type javax.jms.Queue declared in ejb-jar.xml; no destination name in this file.
    interface: true
    traces:
      - path: legacy-source/app/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 74
        line_end: 91
        excerpt: |
          public void onMessage(Message recvMsg) {
            ...
              textMessage = (TextMessage)recvMsg;
              xmlMailMessage = textMessage.getText();
              recMail = Mail.fromXML(xmlMailMessage);
              sendMail(recMail.getAddress(), recMail.getSubject(), recMail.getContent(),  Locale.getDefault());
      - path: legacy-source/app/src/components/mailer/src/ejb-jar.xml
        line_start: 48
        line_end: 57
        excerpt: |
          <message-driven>
            <ejb-name>MailerMDB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.mailer.ejb.MailerMDB</ejb-class>
            <transaction-type>Container</transaction-type>
            <message-driven-destination>
              <destination-type>javax.jms.Queue</destination-type>
