suspected_defects:
  - capability_key: order-notifications
    record_keys: [ONOT-RULE-0003]
    severity: medium
    category: error-swallowed
    title: Mail send failures are swallowed
    description: >
      A failed send is printed to stderr and ignored; the message is consumed with no retry, no alert and no record, so customers silently miss notifications.
    traces:
      - path: legacy-source/app/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 83
        line_end: 85
  - capability_key: order-notifications
    record_keys: [ONOT-RULE-0002]
    severity: low
    category: other
    title: Locale parameter ignored
    description: >
      The sender uses Locale.getDefault() and passes it on, but the helper never uses it; mail is not localised although the store supports several languages.
    traces:
      - path: legacy-source/app/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 70
        line_end: 90
