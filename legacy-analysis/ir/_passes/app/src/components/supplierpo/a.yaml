records:
  - record_key: ORDER-FULFILMENT-ENTITY-0001
    kind: entity
    capability_key: order-fulfilment
    requirement: >
      The system SHALL persist each supplier purchase order with an order identifier (its unique key), an order date, a status, one shipping contact and one or more line items.
    confidence: high
    confidence_basis: >
      Declared in the deployment descriptor (CMP fields, primary key, local references) and in the bean class and the order DTD; two independent places agree.
    risk_class: operational
    basis: >
      Entity bean declares poId (primary key), poDate, poStatus and relations to contact info and line items; DTD requires one or more LineItem.
    plain_text: >
      Every purchase order sent to the supplier is stored with its number, date, status, delivery contact and at least one ordered item.
    technical_note: >
      CMP 2.x entity SupplierOrderEJB, abstract schema SupplierOrder. The line-item minimum is enforced only by the DTD (LineItem+) when XML is validated, not by the bean.
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/ejb-jar.xml
        line_start: 48
        line_end: 69
        excerpt: |
          <entity>
            <description>SupplierOrder CMP EJB</description>
            <display-name>SupplierOrderEB</display-name>
            <ejb-name>SupplierOrderEJB</ejb-name>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
            <cmp-field><field-name>poId</field-name></cmp-field>
            <cmp-field><field-name>poDate</field-name></cmp-field>
            <cmp-field><field-name>poStatus</field-name></cmp-field>
            <primkey-field>poId</primkey-field>
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/rsrc/schemas/SupplierOrder.dtd
        line_start: 38
        line_end: 38
        excerpt: |
          <!ELEMENT SupplierOrder (OrderId, OrderDate, ShippingInfo, LineItem+)>
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: SupplierOrderEJB
      db.object: SupplierOrder (container-generated table)
  - record_key: ORDER-FULFILMENT-BR-0001
    kind: business-rule
    capability_key: order-fulfilment
    requirement: >
      The system SHALL create every supplier purchase order with status PENDING, taking the order identifier and order date from the submitted order.
    confidence: medium
    confidence_basis: >
      One clear place (ejbCreate). Status constant definitions agree, but no caller in this module was read that changes the status afterwards.
    risk_class: operational
    basis: >
      ejbCreate sets poId, poDate from the incoming order and hard-codes PENDING.
    plain_text: >
      A new supplier purchase order always starts as pending.
    technical_note: >
      SupplierOrderEJB.ejbCreate. No setter call moves the status to another value inside this module; the runbook's flow implies fulfilment happens in the supplier application elsewhere.
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 151
        line_end: 156
        excerpt: |
          public String ejbCreate(SupplierOrder supplierOrder) throws CreateException {
            setPoId(supplierOrder.getOrderId());
            setPoDate(supplierOrder.getOrderDate().getTime());
            setPoStatus(OrderStatusNames.PENDING);
            return null;
          }
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: SupplierOrderEJB
  - record_key: ORDER-FULFILMENT-BR-0002
    kind: business-rule
    capability_key: order-fulfilment
    requirement: >
      The system SHALL recognise the order statuses PENDING, APPROVED, DENIED and COMPLETED.
    confidence: high
    confidence_basis: >
      Constants in code and the status flow in the operations runbook describe the same set.
    risk_class: operational
    basis: >
      Status name constants with comments; runbook flow shows PENDING/APPROVED/COMPLETED and purge of DENIED.
    plain_text: >
      An order can be pending, approved, denied or completed.
    technical_note: >
      OrderStatusNames string constants. Which of them are valid for supplier orders specifically is not enforced here (poStatus is a free string).
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/OrderStatusNames.java
        line_start: 50
        line_end: 60
        excerpt: |
          public static final String PENDING = "PENDING";
          public  static final String APPROVED = "APPROVED";
          public  static final String DENIED = "DENIED";
          public  static final String COMPLETED = "COMPLETED";
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        line_start: 22
        line_end: 27
        anchor: p1 (1.1 Order flow)
        excerpt: |
          otherwise                              --> PENDING until the Admin client approves or denies
          APPROVED --> Supplier (PurchaseOrderQueue) --> ships from INVENTORY --> InvoiceTopic --> OPC
          OPC marks the order COMPLETED when every line is shipped
    stack_metadata:
      framework: EJB 2.0
