  - record_key: ORDER-FULFILMENT-BR-0004
    kind: business-rule
    capability_key: order-fulfilment
    requirement: >
      The system SHALL allow supplier purchase orders to be found by status.
    confidence: medium
    confidence_basis: >
      Declared finder query in one place; callers are outside this module.
    risk_class: operational
    basis: >
      EJB-QL finder findOrdersByStatus.
    plain_text: >
      The supplier can list its purchase orders by their status.
    technical_note: >
      findOrdersByStatus(String) with EJB-QL on poStatus.
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/ejb-jar.xml
        line_start: 95
        line_end: 104
        excerpt: |
          <method-name>findOrdersByStatus</method-name>
          ...
          <ejb-ql>SELECT DISTINCT OBJECT(a) FROM SupplierOrder a WHERE a.poStatus = ?1</ejb-ql>
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: SupplierOrderEJB
  - record_key: ORDER-FULFILMENT-INT-0001
    kind: integration
    capability_key: order-fulfilment
    requirement: >
      The system SHALL exchange supplier purchase orders as XML documents containing order id, order date (yyyy-MM-dd), shipping contact and one or more line items, validated against the SupplierOrder DTD by default.
    confidence: high
    confidence_basis: >
      Enforced by the DTD, the serialiser/parser code and the validating flag; the runbook confirms purchase orders travel by a supplier queue.
    risk_class: operational
    basis: >
      toXML/fromXML with DTD validation on; runbook names jms/supplier/PurchaseOrderQueue.
    plain_text: >
      Purchase orders are sent to the supplier as structured documents in an agreed layout, and incoming ones are checked against that layout.
    technical_note: >
      SupplierOrder.toDOM/fromDOM, VALIDATING = true, DTD public id. Queue wiring is outside this module.
    interface: true
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
        line_start: 60
        line_end: 66
        excerpt: |
          (see DTD_SYSTEM_ID, VALIDATING = true, XML element names and yyyy-MM-dd date format)
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
        line_start: 189
        line_end: 202
        excerpt: |
          Element root = document.createElement(XML_SUPPLIERORDER);
          XMLDocumentUtils.appendChild(document, root, XML_ORDERID, orderId);
          XMLDocumentUtils.appendChild(document, root, XML_ORDERDATE,
                                       dateFormat.format(orderDate));
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        line_start: 15
        line_end: 16
        anchor: p1 (messaging)
        excerpt: |
          jms/supplier/PurchaseOrderQueue
    stack_metadata:
      framework: JAXP/DTD
      jms.queue: jms/supplier/PurchaseOrderQueue
  - record_key: ORDER-FULFILMENT-BR-0005
    kind: business-rule
    capability_key: order-fulfilment
    requirement: >
      GIVEN an incoming supplier purchase order whose date cannot be read WHEN it is parsed THEN the system SHALL use the current date as the order date and continue.
    confidence: medium
    confidence_basis: >
      One clear place, marked "FIX ME" by the original authors.
    risk_class: operational
    basis: >
      Catch block resets date to now.
    plain_text: >
      If an incoming purchase order has an unreadable date, today's date is used instead.
    technical_note: >
      SupplierOrder.fromDOM catch(Exception); logs to stderr only.
    interface: true
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
        line_start: 218
        line_end: 223
        excerpt: |
          } catch (Exception exception) {
            supplierOrder.setOrderDate(new Date()); // FIX ME!
            System.err.println(XML_ORDERDATE + ": " + exception.getMessage() + " reset to current date.");
          }
    stack_metadata:
      framework: JAXP
  - record_key: ORDER-FULFILMENT-BR-0006
    kind: business-rule
    capability_key: order-fulfilment
    requirement: >
      The system SHALL delete supplier purchase orders together with their contact information and addresses when the order retention purge removes completed or denied orders older than 180 days.
    confidence: low
    confidence_basis: >
      Stated only in the runbook; the purge SQL is not in this module, so it is inferred from the document rather than read in code.
    risk_class: regulated
    basis: >
      Runbook 3.5. Filed here because it concerns supplier order data; the batch capability owns the job itself.
    plain_text: >
      Supplier orders for completed or denied orders are removed after 180 days.
    technical_note: >
      Batch job PS_ORDER_PURGE (outside this module).
    interface: false
    traces:
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        line_start: 90
        line_end: 93
        anchor: p1-3 (3.5 PS_ORDER_PURGE)
        excerpt: |
          Sundays only. Deletes COMPLETED and DENIED orders older than 180 days, with their order lines, supplier orders,
          contact information, addresses and payment cards.
    stack_metadata:
      batch.trigger: PS_ORDER_PURGE
