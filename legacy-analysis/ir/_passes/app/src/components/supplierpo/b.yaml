records:
  - record_key: ORDF-ENT-0001
    kind: entity
    capability_key: order-fulfilment
    requirement: The system SHALL persist a supplier purchase order with a purchase order id, a purchase order date (epoch time), a status, one shipping contact, and a collection of line items.
    confidence: high
    confidence_basis: Bean accessors plus ejb-jar CMP/CMR declarations plus the DTD agree.
    risk_class: operational
    basis: Abstract accessors on the entity bean and a DTD with OrderId, OrderDate, ShippingInfo, LineItem+.
    plain_text: Each order sent to the supplier is stored with its number, date, status, shipping contact and the items ordered.
    technical_note: SupplierOrderEJB is a CMP entity (abstract schema SupplierOrder) with CMR fields contactInfo and lineItems, both cascade-delete.
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 81
        line_end: 137
        excerpt: |
          public abstract String getPoId();
          public abstract long getPoDate();
          public abstract String getPoStatus();
          public abstract ContactInfoLocal getContactInfo();
          public abstract Collection getLineItems();
      - path: legacy-source/app/src/components/supplierpo/src/ejb-jar.xml
        line_start: 240
        line_end: 307
        excerpt: |
          <cmr-field-name>contactInfo</cmr-field-name>
          <cascade-delete />
          <cmr-field-name>lineItems</cmr-field-name>
    stack_metadata:
      framework: EJB 2.x CMP
      ejb.bean: SupplierOrderEJB
  - record_key: ORDF-BR-0001
    kind: business-rule
    capability_key: order-fulfilment
    requirement: GIVEN a supplier order is received for creation, WHEN it is stored, THEN the system SHALL take the order id and date from the incoming order and set the status to PENDING.
    confidence: medium
    confidence_basis: One clear place (ejbCreate); the status constant list corroborates PENDING as the initial state.
    risk_class: operational
    basis: ejbCreate sets id, date and PENDING unconditionally.
    plain_text: A new supplier order always starts as pending, carrying the order number and date it was sent with.
    technical_note: SupplierOrderEJB.ejbCreate.
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 151
        line_end: 156
        excerpt: |
          setPoId(supplierOrder.getOrderId());
          setPoDate(supplierOrder.getOrderDate().getTime());
          setPoStatus(OrderStatusNames.PENDING);
  - record_key: ORDF-BR-0002
    kind: business-rule
    capability_key: order-fulfilment
    requirement: When a supplier order is created the system SHALL create a contact record from the shipping info and one line-item record per incoming line item, and attach them to the order, failing the creation if the lookup of those services fails.
    confidence: medium
    confidence_basis: One clear place (ejbPostCreate); no tests seen.
    risk_class: operational
    basis: ejbPostCreate loops over incoming line items creating LineItemLocal with a fixed second argument 0.
    plain_text: Saving a supplier order also saves its shipping contact and every item line; if that cannot be done the order is not created.
    technical_note: ejbPostCreate uses ServiceLocator; ServiceLocatorException becomes CreateException. Line items created with second arg 0 (meaning not evident, presumably the order-line number).
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 162
        line_end: 184
        excerpt: |
