          ...
          LineItemLocal lineItemloc = (LineItemLocal) lineItemref.create(li, 0);
          addLineItem(lineItemloc);
    stack_metadata:
      ejb.transaction: Required
  - record_key: ORDF-WF-0001
    kind: workflow
    capability_key: order-fulfilment
    requirement: The system SHALL recognise the order statuses PENDING, APPROVED, DENIED and COMPLETED, with transitions PENDING to APPROVED to COMPLETED, or PENDING to DENIED.
    confidence: high
    confidence_basis: Stated in the class comment and constants, and the operations runbook and user guide describe the same statuses; transitions themselves are not enforced in this module.
    risk_class: operational
    basis: OrderStatusNames comment and constants; runbook order flow.
    plain_text: An order is pending, then approved and later completed, or it is denied.
    technical_note: Only constants here; no transition guard in the supplierpo module. Only PENDING is ever set by this module.
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/OrderStatusNames.java
        line_start: 44
        line_end: 60
        excerpt: |
          pending->approved->completed   or
          pending->denied
          PENDING = "PENDING"; APPROVED = "APPROVED"; DENIED = "DENIED"; COMPLETED = "COMPLETED"
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        anchor: 1.1 Order flow
        excerpt: |
          OPC marks the order COMPLETED when every line is shipped
  - record_key: ORDF-INT-0001
    kind: integration
    capability_key: order-fulfilment
    requirement: The system SHALL accept a supplier purchase order as an XML document containing OrderId, OrderDate, ShippingInfo (contact info) and one or more LineItem elements.
    confidence: medium
    confidence_basis: DTD and fromDOM agree; the queue transport is only seen in the runbook, not in this module.
    risk_class: operational
    basis: SupplierOrder.dtd content model; fromDOM requires a SupplierOrder root element.
    plain_text: Approved orders are sent to the supplier as a structured message with order number, date, shipping contact and at least one item.
    technical_note: DTD SupplierOrder.dtd; SupplierOrder.fromDOM; queue jms/supplier/PurchaseOrderQueue per runbook.
    interface: true
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/rsrc/schemas/SupplierOrder.dtd
        line_start: 38
        line_end: 38
        excerpt: |
          <!ELEMENT SupplierOrder (OrderId, OrderDate, ShippingInfo, LineItem+)>
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        anchor: 1.1 Order flow
        excerpt: |
          APPROVED --> Supplier (PurchaseOrderQueue) --> ships from INVENTORY --> InvoiceTopic --> OPC
    stack_metadata:
      jms.queue: jms/supplier/PurchaseOrderQueue
  - record_key: ORDF-BR-0003
