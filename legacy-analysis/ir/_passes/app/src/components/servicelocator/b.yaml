  - record_key: ORDN-BR-0003
    kind: business-rule
    capability_key: order-notifications
    requirement: >
      GIVEN any lookup failure, WHEN a naming or other exception occurs, THEN the system SHALL raise a single lookup exception wrapping the original cause to the caller.
    confidence: high
    confidence_basis: >
      Same catch-and-wrap structure in every method of both classes.
    risk_class: operational
    basis: >
      Every getter catches NamingException and Exception and throws ServiceLocatorException(cause).
    plain_text: >
      If a needed resource or setting cannot be found, the caller is told with one kind of error that carries the original reason.
    technical_note: >
      A wrong-typed value surfaces as wrapped ClassCastException. getBoolean on a missing entry fails inside the try (NamingException) so no NPE escapes.
    interface: false
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 217
        line_end: 227
        excerpt: |
          bool = (Boolean)ic.lookup(envName);
          } catch (NamingException ne) {
                throw new ServiceLocatorException(ne);
          } catch (Exception e) {
                throw new ServiceLocatorException(e);
          }
          return bool.booleanValue();
    stack_metadata:
      framework: J2EE JNDI
  - record_key: ORDN-BR-0004
    kind: business-rule
    capability_key: order-notifications
    requirement: >
      The system SHALL give the web tier one shared locator instance created at class load, and GIVEN that creation fails, the system SHALL only print the error to standard error, leaving the shared instance absent.
    confidence: medium
    confidence_basis: >
      One clear place (static initializer); consequence for callers is inferred.
    risk_class: operational
    basis: >
      Static block catches ServiceLocatorException and prints it; getInstance returns null afterwards.
    plain_text: >
      The web side uses a single shared lookup service; if it cannot start, the problem is only logged and later callers will fail.
    technical_note: >
      Static init swallows exception; getInstance() then returns null and callers would hit NullPointerException. The ejb-tier class has a public constructor and is instantiated by callers instead.
    interface: false
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 74
        line_end: 96
