  - record_key: ORDN-BR-0002
    kind: business-rule
    capability_key: order-notifications
    requirement: >
      GIVEN the web-tier locator, WHEN a home, connection factory, queue, topic or data source is requested a second time by the same name, THEN the system SHALL return the previously resolved instance without a new lookup; URL, boolean and string entries SHALL be looked up every time.
    confidence: high
    confidence_basis: >
      Cache logic visible in each web-tier getter and class comment says caching strategy; the ejb-tier class has no cache (comparison within code).
    risk_class: operational
    basis: >
      web ServiceLocator keeps a synchronized map keyed by name; ejb variant does not cache.
    plain_text: >
      On the web side, shared resources are looked up once and reused; settings values are re-read each time.
    technical_note: >
      Collections.synchronizedMap(HashMap) cache; containsKey/get then put is not atomic, so concurrent first lookups may both hit JNDI (harmless). Cache key is the name only, so one name used for two types would return a wrong cast.
    interface: false
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 106
        line_end: 121
        excerpt: |
          if (cache.containsKey(jndiHomeName)) {
              home = (EJBLocalHome) cache.get(jndiHomeName);
          } else {
              home = (EJBLocalHome) ic.lookup(jndiHomeName);
              cache.put(jndiHomeName, home);
          }
