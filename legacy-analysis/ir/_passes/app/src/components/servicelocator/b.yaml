    kind: requirement
    capability_key: order-notifications
    requirement: >
      The system SHALL provide a central lookup facility that resolves named
      resources (EJB local homes, EJB remote homes, JMS queue and topic
      connection factories, queues, topics, data sources, URL, boolean and
      string environment entries) from the naming service by name.
    confidence: high
    confidence_basis: >
      Implemented identically in two classes (web and ejb tiers). No document or test describes it.
    risk_class: operational
    basis: >
      Each getter performs a naming lookup and casts to the expected type.
    plain_text: >
      Other parts of the application find shared resources such as message queues, databases and settings through one common lookup service.
    technical_note: >
      Service Locator pattern over InitialContext.lookup; remote homes are narrowed with PortableRemoteObject.narrow. Resource names are supplied by callers; no names are hard-coded here. Capability key is the closest fit (queues and the SEND_CONFIRMATION_MAIL flag are used by notification code); the component is shared infrastructure.
