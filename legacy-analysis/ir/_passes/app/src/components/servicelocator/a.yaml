  - record_key: ORDN-REQ-0002
    kind: requirement
    capability_key: order-notifications
    requirement: >
      The system SHALL, on the web tier, provide a single shared locator instance that caches resolved homes, queues, queue and topic connection factories, topics and data sources by name so each name is looked up only once.
    confidence: high
    confidence_basis: >
      Singleton and cache logic appear repeatedly in the web class and its class comment states the strategy; contrasts with the uncached ejb class.
    risk_class: operational
    basis: >
      web/ServiceLocator caches in a synchronized map keyed by name; the EJB-tier variant does not cache.
    plain_text: >
      On the web side, once a shared service has been found it is remembered and reused rather than looked up again.
    technical_note: >
      Static singleton created in a static initialiser; Collections.synchronizedMap(HashMap). URL, boolean and string lookups bypass the cache.
    interface: false
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 59
        line_end: 96
        excerpt: |
          * This implementation uses the "singleton" strategy and also the "caching"
          * strategy.
          * This implementation is intended to be used on the web tier and
          * not on the ejb tier.
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 175
        line_end: 191
        excerpt: |
          public  Queue getQueue(String queueName) throws ServiceLocatorException {
            Queue queue = null;
            try {
              if (cache.containsKey(queueName)) {
                  queue = (Queue) cache.get(queueName);
              } else {
                  queue =(Queue)ic.lookup(queueName);
                  cache.put(queueName, queue);
    stack_metadata:
      framework: J2EE service locator pattern
