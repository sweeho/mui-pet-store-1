records:
  - record_key: ORDN-INT-0001
    kind: integration
    capability_key: order-notifications
    requirement: >
      The system SHALL resolve named infrastructure resources (local and remote component homes, message queues and queue connection factories, topics and topic connection factories, data sources, URLs, boolean and string settings) by name from the container's naming service on request.
    confidence: medium
    confidence_basis: >
      One clear place (two classes implementing the same lookup methods); no tests or config in this module show callers or names looked up.
    risk_class: operational
    basis: >
      The module has no business rules; it is the lookup utility used to reach JMS destinations (used for async order mail) and other resources. No listed capability fits exactly, so it is filed under order-notifications as the closest (async messaging).
    plain_text: >
      The application finds the shared services it depends on, such as message queues, databases and configuration values, by their configured names.
    technical_note: >
      ejb/ServiceLocator.java and web/ServiceLocator.java wrap javax.naming.InitialContext.lookup with a cast per resource type.
