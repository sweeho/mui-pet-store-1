suspected_defects:
  - capability_key: order-notifications
    record_keys: [ORDN-REQ-0002]
    severity: medium
    category: error-swallowed
    title: Web locator initialisation failure is only printed, leaving no instance
    description: >
      If creating the singleton fails, the error is printed to the error stream and swallowed; getInstance() then returns null and callers would fail with a null reference rather than a locator error.
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 74
        line_end: 81
        excerpt: |
          static {
            try {
              me = new ServiceLocator();
