  - record_key: ORDN-REQ-0003
    kind: requirement
    capability_key: order-notifications
    requirement: >
      GIVEN a lookup fails for any reason WHEN the locator is asked for a resource THEN the system SHALL raise a single locator error that wraps the underlying cause and can report its root cause.
    confidence: high
    confidence_basis: >
      Every lookup method wraps exceptions, and the exception class implements wrapping and root-cause retrieval.
    risk_class: operational
    basis: >
      All methods catch NamingException and Exception and rethrow ServiceLocatorException.
    plain_text: >
      When a shared service cannot be found, callers get one consistent error that carries the original reason.
    technical_note: >
      ServiceLocatorException has getException() and recursive getRootCause().
