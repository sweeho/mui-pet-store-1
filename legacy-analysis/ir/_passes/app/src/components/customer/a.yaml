  - record_key: CUSTOMER-ACCOUNTS-WORKFLOW-0001
    kind: workflow
    capability_key: customer-accounts
    requirement: GIVEN a new customer is created WHEN creation completes THEN the system SHALL attach an account with status "active" and a profile holding default preferences.
    confidence: medium
    confidence_basis: One clear place (post-create hook); no test or document seen.
    risk_class: operational
    basis: Post-create hook creates account (Active) and profile with defaults.
    plain_text: A newly registered customer automatically gets an active account and a default profile.
    technical_note: CustomerEJB.ejbPostCreate looks up Account and Profile local homes via JNDI and creates them; a naming failure raises CreateException.
    interface: false
    traces:
      - path: legacy-source/app/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
              public void ejbPostCreate(String userId) throws CreateException {
                  try {
                  InitialContext ic = new InitialContext();
                  AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
                  AccountLocal account = alh.create(AccountLocalHome.Active);
                  setAccount(account);
          
                  ProfileLocalHome plh = (ProfileLocalHome) ic.lookup("java:comp/env/ejb/Profile");
                  ProfileLocal profile = plh.create(ProfileLocalHome.DefaultPreferredLanguage,
                  ProfileLocalHome.DefaultFavoriteCategory, ProfileLocalHome.DefaultMyListPreference,
                  ProfileLocalHome.DefaultBannerPreference);
                  setProfile(profile);
                  } catch (NamingException ne) {
                      throw new CreateException ("could not lookup ejb. Exception is " + ne.getMessage());
                  }
              }
    stack_metadata:
      ejb.bean: CustomerEJB
