  - record_key: CUSTOMER-ACCOUNTS-ENTITY-0002
    kind: entity
    capability_key: customer-accounts
    requirement: The system SHALL keep for each account its status, one contact-information record and one credit card record, created empty when the account is created without them.
    confidence: medium
    confidence_basis: One clear place (AccountEJB post-create); related beans live in other modules.
    risk_class: regulated
    basis: Account creates empty ContactInfo and CreditCard when created by status only.
    plain_text: Each account holds contact details and payment card details, initially blank.
    technical_note: AccountEJB.ejbPostCreate(status) creates ContactInfo and CreditCard via JNDI; the overloaded create accepts existing ones. Cascade-delete from customer to account in ejb-jar.xml relationships.
