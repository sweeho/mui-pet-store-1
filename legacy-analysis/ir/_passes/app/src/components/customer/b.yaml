  - record_key: CA-WF-0001
    kind: workflow
    capability_key: customer-accounts
    requirement: WHEN a customer is created, the system SHALL create an associated account with status "active" and an associated profile with default preferences.
    confidence: high
    confidence_basis: Enforced in CustomerEJB.ejbPostCreate and constants in the two home interfaces; consistent across them.
    risk_class: operational
    basis: ejbPostCreate creates Account (Active) and Profile (defaults) and links them.
    plain_text: A new customer automatically gets an active account and a profile with default preferences.
    technical_note: CustomerEJB.ejbPostCreate looks up ejb/Account and ejb/Profile and creates them; a naming failure raises CreateException.
    interface: false
    traces:
      - path: legacy-source/app/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
          public void ejbPostCreate(String userId) throws CreateException {
              try {
              InitialContext ic = new InitialContext();
              AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
              AccountLocal account = alh.create(AccountLocalHome.Active);
              setAccount(account);
      - path: legacy-source/app/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountLocalHome.java
        line_start: 48
        line_end: 48
        excerpt: |
