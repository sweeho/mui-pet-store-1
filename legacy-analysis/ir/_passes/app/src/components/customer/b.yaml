findings:
  - kind: ambiguity
    path: legacy-source/app/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
    description: >
      No duplicate-user-id or sign-on rule exists in this module; uniqueness relies on the primary key. The user guide (legacy-analysis/sources/pdf/petstore-user-guide/extracted.md, anchor p1) only says to fill the sign-up form. Sign-on and duplicate handling live elsewhere.
