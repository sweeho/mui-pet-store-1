records:
  - record_key: ORDN-INT-0001
    kind: integration
    capability_key: order-notifications
    requirement: >
      The system SHALL accept a text message from a caller and publish it as a single text message to the configured asynchronous sender queue, so that the message is processed later by a separate consumer.
    confidence: high
    confidence_basis: >
      Enforced in the bean code and declared in the deployment descriptor (queue resource reference), and the runbook describes asynchronous queue-based order flow in general. The consumer of this specific queue is not in this module.
    risk_class: operational
    basis: >
      sendAMessage creates a queue connection and session, a text message carrying the string, and sends it to the queue looked up as the async sender queue.
    plain_text: >
      When another part of the shop asks to send a message in the background, the message is placed on a queue and handled later, without making the caller wait for the work.
    technical_note: >
      Stateless session bean AsyncSenderEJB.sendAMessage(String) uses QueueConnectionFactory java:comp/env/jms/QueueConnectionFactory and Queue java:comp/env/jms/AsyncSenderQueue, resolved once in ejbCreate via ServiceLocator.
    interface: true
    traces:
      - path: legacy-source/app/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 58
        line_end: 90
        excerpt: |
          qConnect = qFactory.createQueueConnection();
          session = qConnect.createQueueSession(true,0);
          qSender = session.createSender(q);
          TextMessage jmsMsg = session.createTextMessage();
          jmsMsg.setText(msg);
          qSender.send(jmsMsg);
      - path: legacy-source/app/src/components/asyncsender/src/ejb-jar.xml
        line_start: 58
