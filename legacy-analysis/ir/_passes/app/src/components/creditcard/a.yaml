suspected_defects:
  - capability_key: checkout-and-payment
    record_keys: [CHK-BR-0002]
    severity: medium
    category: other
    title: Missing expiry silently defaults to January 2010
    description: >
      An absent or malformed expiry yields a hard-coded, long-past date rather than an error, and the component performs no validation of number, type or expiry.
    traces:
      - path: legacy-source/app/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 106
        line_end: 106
        excerpt: |
          return "2010";
findings:
  - kind: ambiguity
    path: legacy-source/app/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
    description: >
      Card validation (number format, type, expiry in future) is not in this component and no document in legacy-analysis/sources mentions it; it may live in the web tier, covered by another shard.
