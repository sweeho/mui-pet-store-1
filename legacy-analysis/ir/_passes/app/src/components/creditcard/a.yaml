          <!ELEMENT CardNumber (#PCDATA)>
          <!ELEMENT CardType (#PCDATA)>
          <!ELEMENT ExpiryDate (#PCDATA)>
    stack_metadata:
      framework: EJB 2.x CMP
      ejb.bean: CreditCardEJB
  - record_key: CHK-BR-0001
    kind: business-rule
    capability_key: checkout-and-payment
    requirement: >
      The system SHALL store the card expiry as a single "month/year" text, and SHALL derive the expiry month as the text before the first slash and the expiry year as the text after it.
    confidence: medium
    confidence_basis: >
      One clear place (the accessor methods); no test or document corroborates the format.
    risk_class: regulated
    basis: >
      Month and year are parsed from the combined expiry string by position of the slash.
    plain_text: >
      A card's expiry is kept as one "month/year" value, and the month and year are read from either side of the slash.
    technical_note: >
      CreditCardEJB.getExpiryMonth/getExpiryYear use indexOf("/"). No validation of numeric content or range.
    interface: false
    traces:
      - path: legacy-source/app/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |
          public String getExpiryMonth() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              // get the slash and return the text before it
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(0,slashStart);
            }
            return "01";
          }
    stack_metadata:
      ejb.bean: CreditCardEJB
  - record_key: CHK-BR-0002
    kind: business-rule
    capability_key: checkout-and-payment
    requirement: >
      GIVEN a card whose expiry text is missing or has no slash, WHEN the expiry month or year is read, THEN the system SHALL return month "01" and year "2010" respectively.
    confidence: low
    confidence_basis: >
      Bare literal defaults with no comment, test or document explaining them.
    risk_class: regulated
    basis: >
      Hard-coded fallback values in the accessors.
    plain_text: >
      If a card has no readable expiry, it is treated as expiring in January 2010.
    technical_note: >
      Literal fallbacks "01" and "2010" in getExpiryMonth/getExpiryYear.
    interface: false
    traces:
      - path: legacy-source/app/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 95
        line_end: 106
        excerpt: |
          return "01";
          }

          public String getExpiryYear() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              // get the slash and return the text after it
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(slashStart +1, dateString.length());

            }
            return "2010";
    stack_metadata:
      ejb.bean: CreditCardEJB
  - record_key: CHK-REQ-0001
    kind: requirement
    capability_key: checkout-and-payment
    requirement: >
      The system SHALL create a credit card record from either a card number, type and expiry, or an existing credit card data object, and SHALL return the stored values as a data object on request.
    confidence: medium
    confidence_basis: >
      Single class implements this; no callers examined in this module.
    risk_class: regulated
    basis: >
      Overloaded create methods copy the three fields; getData copies them back out.
    plain_text: >
      Card details entered at checkout can be saved and read back unchanged.
    technical_note: >
      ejbCreate(String,String,String), ejbCreate(CreditCard), getData(). A no-argument ejbCreate also exists and sets nothing. No validation of card number, type or expiry occurs in this component.
