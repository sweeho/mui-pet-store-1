  - record_key: CHK-REQ-0002
    kind: requirement
    capability_key: checkout-and-payment
    requirement: >
      The system SHALL allow any caller to invoke every credit card operation, and SHALL run removal of a credit card within a transaction.
    confidence: medium
    confidence_basis: >
      Declared once in the descriptor; the rest of the transaction list was only partly read.
    risk_class: regulated
    basis: >
      Method permission wildcard and container transaction attribute for remove.
    plain_text: >
      Card records can be used by any part of the application, and deleting one is done as a single all-or-nothing step.
    technical_note: >
      ejb-jar.xml method-permission on CreditCardEJB method "*"; container-transaction Required for LocalHome.remove; security identity uses caller identity.
    interface: false
    traces:
