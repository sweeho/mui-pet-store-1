records:
  - record_key: CHK-ENT-0001
    kind: entity
    capability_key: checkout-and-payment
    requirement: >
      The system SHALL hold a credit card as three text attributes: card number, card type and expiry date.
    confidence: high
    confidence_basis: >
      Stated in the CMP field declarations, the abstract accessors, and the XML DTD; three places agree. No length or format constraints are visible.
    risk_class: regulated
    basis: >
      The deployment descriptor declares cardNumber, cardType and expiryDate as persisted fields; the bean declares matching accessors; the DTD defines the same three elements.
    plain_text: >
      A saved credit card consists of its number, its type and its expiry date.
    technical_note: >
      CreditCardEJB is a container-managed entity bean (CMP 2.x, abstract schema CreditCard) with String fields. CreditCard.dtd defines an interchange form (CardNumber, CardType, ExpiryDate).
    interface: false
    traces:
      - path: legacy-source/app/src/components/creditcard/src/ejb-jar.xml
        line_start: 57
        line_end: 68
        excerpt: |
          <cmp-field>
            <description>no description</description>
            <field-name>expiryDate</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>cardType</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>cardNumber</field-name>
          </cmp-field>
      - path: legacy-source/app/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 50
        line_end: 57
        excerpt: |
          public abstract String getCardNumber();
          public abstract void setCardNumber(String cardNumber);

          public abstract String getCardType();
          public abstract void setCardType(String cardType);

          public abstract String getExpiryDate();
          public abstract void setExpiryDate(String expiryDate);
