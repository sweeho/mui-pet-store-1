  - record_key: CATB-BR-0010
    kind: business-rule
    capability_key: catalog-browsing
    requirement: GIVEN the catalog data store cannot be reached or a query fails WHEN any catalog operation runs THEN the system SHALL abort the request with a system error carrying the underlying message.
    confidence: medium
    confidence_basis: Uniform wrapping in the bean; one clear place.
    risk_class: operational
    basis: SQL and lookup failures become CatalogDAOSysException then EJBException.
    plain_text: If the catalog database is unavailable the shopper gets an error page rather than partial data.
    technical_note: Resources are closed in finally blocks with close errors swallowed.
    interface: false
