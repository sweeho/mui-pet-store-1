  - record_key: CATB-REQ-0009
    kind: integration
    capability_key: catalog-browsing
    requirement: The system SHALL select its catalog SQL dialect (Cloudscape or Oracle statements) by a configured database identifier, so that a new database needs only a new statement set and identifier.
    confidence: high
    confidence_basis: Code reads the configuration and the admin guide documents the procedure.
    risk_class: operational
    basis: DAO loads SQL statements from an XML file located via JNDI and picks the database-specific set.
    plain_text: The product catalog can run against different database vendors by configuration.
    technical_note: JNDI names CATALOG_DAO_SQL_URL and CATALOG_DAO_DATABASE; DTD-validated SAX parse at DAO construction.
