          }

suspected_defects:
  - capability_key: catalog-browsing
    record_keys: [CATB-REQ-0003]
    severity: high
    category: data-corruption
    title: Generic item list maps columns to the wrong item fields
    description: >
      GET_ITEMS returns catid, product name, itemid... but the generic DAO builds each Item with the
      product id as category and the category id as product id, and ignores the leading catid meaning.
      The listing therefore carries a swapped category/product identity.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 319
        line_end: 323
        excerpt: |
