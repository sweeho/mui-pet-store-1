  - record_key: CATB-REQ-0005
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL support keyword search over items, splitting the query on whitespace into distinct keywords and matching an item when ANY keyword is contained, case-insensitively, in the product name, category id or item description in the customer's locale.
    confidence: high
    confidence_basis: Tokenising in DAO, OR-ed SQL fragments in config, lower-casing in the Cloudscape variant.
    risk_class: presentational
    basis: Keywords are de-duplicated in a set; each yields three LIKE %kw% parameters joined by OR.
    plain_text: Typing several words in search shows items matching any of the words in their name, category or description, ignoring upper/lower case.
    technical_note: GenericCatalogDAO builds parameters without lower-casing (see suspected defect); CloudscapeCatalogDAO lower-cases keywords at lines 392-400.
    interface: false
