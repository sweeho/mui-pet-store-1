  - record_key: CB-REQ-0005
    kind: requirement
    capability_key: internationalisation
    requirement: The system SHALL interpret a locale given as text of the form language_country, and the word "default" as the server default locale.
    confidence: medium
    confidence_basis: One place (helper); variant parsing is broken so only language_country is effective.
    risk_class: presentational
    basis: getLocaleFromString splits on underscore.
    plain_text: The shopper's language setting is understood in the usual language_country form.
    technical_note: Filed under internationalisation as closest fit; catalog queries are keyed by locale.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 359
        line_end: 372
        excerpt: |
              private Locale getLocaleFromString(String localeString) {
                  if (localeString == null) return null;
                  if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
                  int languageIndex = localeString.indexOf('_');
                  if (languageIndex  == -1) return null;
suspected_defects:
  - capability_key: catalog-browsing
    record_keys: [CB-REQ-0003]
    severity: high
    category: contradicts-document
    title: Search keywords are not lower-cased, so mixed-case input may not match
    description: >
      The user guide says search is not case-sensitive. The SQL lower-cases the columns but the Java code binds the keyword as typed with no lower-casing, so a keyword containing capitals (e.g. "Bulldog") compares against lower-case text and cannot match. Could not see a caller that lower-cases the query beforehand within this module.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
