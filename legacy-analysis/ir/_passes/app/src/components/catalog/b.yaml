records:
  - record_key: CB-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL provide a four-level catalog hierarchy (category, product, item, item detail) in which categories list their products, products list their items, and an item can be fetched by its identifier.
    confidence: high
    confidence_basis: Read in the DAO, the session bean facade, the helper, and confirmed by the user guide.
    risk_class: presentational
    basis: Seven read operations (category, categories, product, products, item, items, search) are exposed identically through DAO, EJB and helper.
    plain_text: Shoppers can open a category to see its products, a product to see its items, and an item to see its detail.
    technical_note: CatalogEJB delegates to CatalogDAO; CatalogHelper can call the DAO directly (fast lane) or the EJB.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/ejb/CatalogEJB.java
        line_start: 85
        line_end: 92
        excerpt: |
              public Category getCategory(String categoryID, Locale l) {
                  try {
                      return dao.getCategory(categoryID, l);
                  }
                  catch (CatalogDAOSysException se) {
                      throw new EJBException(se.getMessage());
                  }
              }
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: "2.2 Browsing and searching"
        kind: document
        excerpt: Select a category to list its products, a product to list its items, and an item to see its detail.
    stack_metadata:
      framework: EJB 2 stateless session bean
      ejb.bean: CatalogEJB
  - record_key: CB-REQ-0002
    kind: business-rule
    capability_key: catalog-browsing
    requirement: The system SHALL return catalog names and descriptions for the requested locale only, filtering every category, product and item query by locale.
    confidence: high
    confidence_basis: Every statement in both database variants filters on locale and every DAO method passes the locale as first parameter.
    risk_class: presentational
    basis: Locale string is the first bound parameter of every query.
    plain_text: Catalog text is shown in the shopper's language; only entries for that language are returned.
    technical_note: Locale passed as locale.toString() into SQL where locale = ?. A null locale (see defect) would throw.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 242
        line_end: 242
        excerpt: |
              String[] parameterValues = new String[] { locale.toString(), categoryID };
      - path: legacy-source/app/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 89
        line_end: 89
        excerpt: |
                              where locale = ? and a.catid = ? order by name
    stack_metadata:
      db.object: category_details, product_details, item_details
  - record_key: CB-BR-0001
    kind: business-rule
    capability_key: catalog-browsing
    requirement: The system SHALL list categories and products ordered by name.
    confidence: medium
    confidence_basis: Seen in the SQL configuration for both database variants; items have no ordering clause.
    risk_class: presentational
    basis: GET_CATEGORIES and GET_PRODUCTS end with order by name.
    plain_text: Categories and the products within a category appear in alphabetical order by name.
    technical_note: Items (GET_ITEMS) and search results have no order by, so order is database-determined.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 75
        line_end: 75
        excerpt: |
                              where locale = ?  order by name
  - record_key: CB-BR-0002
    kind: business-rule
    capability_key: catalog-browsing
    requirement: The system SHALL return list results one page at a time from a given start offset with a given page size, indicating whether a next page exists, and SHALL return an empty page when the start is negative or beyond the end of the results.
    confidence: high
    confidence_basis: Same paging loop in four DAO methods plus the Page model; the user guide states 2 rows per page.
    risk_class: presentational
    basis: absolute(start+1) positions the cursor; loop reads up to count rows and sets hasNext from one-row lookahead. Previous-page availability is start > 0.
    plain_text: Lists show a few entries at a time with Next and Previous links; asking for a page past the end gives an empty list.
    technical_note: Page.getStartOfPreviousPage is max(start - size, 0). Helper default count is 2 and start 0.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 248
        line_end: 258
        excerpt: |
              if (start >= 0 && resultSet.absolute(start + 1)) {
                boolean hasNext = false;
                List products = new ArrayList();
                do {
                  products.add(new Product(resultSet.getString(1).trim(),
                                           resultSet.getString(2),
                                           resultSet.getString(3)));
                } while ((hasNext = resultSet.next()) && (--count > 0));
                return new Page(products, start, hasNext);
              }
              return Page.EMPTY_PAGE;
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 82
        line_end: 83
        excerpt: |
              private int count = 2;
              private int start = 0;
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: "2.2 Browsing and searching"
        excerpt: Lists show 2 rows at a time with Next and Previous.
  - record_key: CB-BR-0003
    kind: business-rule
    capability_key: catalog-browsing
    requirement: GIVEN a page size of zero or less WHEN a non-empty page is read THEN the system SHALL still return one entry, because the first row is always read before the count is checked.
    confidence: medium
    confidence_basis: Inferred from the do/while loop structure, not stated anywhere; no test seen.
    risk_class: presentational
    basis: do { add } while (next && --count > 0) always adds one row.
    plain_text: Asking for a page size of zero still returns one entry.
    technical_note: Side effect of loop form; likely unintended.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 332
        line_end: 332
        excerpt: |
                } while ((hasNext = resultSet.next()) && (--count > 0));
  - record_key: CB-REQ-0003
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL search items by splitting the query on whitespace into distinct keywords and return items for which any keyword is contained in the product name, the category identifier, or the item description, for the requested locale.
    confidence: high
    confidence_basis: Java tokenising plus SQL OR clauses for both database variants, plus user guide statement.
    risk_class: presentational
    basis: Keywords go into a set (duplicates removed); each contributes three LIKE %kw% parameters; fragments joined with OR.
    plain_text: Typing one or more words in the search box shows items matching any of the words in the product name, category or description.
    technical_note: SQL fragment occurrence=VARIABLE is repeated once per keyword by buildSQLStatement.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 345
        line_end: 365
        excerpt: |
                Collection keywordSet = new HashSet();
                StringTokenizer tokenizer = new StringTokenizer(searchQuery);
                while (tokenizer.hasMoreTokens()) {
                  keywordSet.add(tokenizer.nextToken());
                }
                if (keywordSet.isEmpty()) {
                  return Page.EMPTY_PAGE;
                }
