  - record_key: CUST-REQ-0004
    kind: business-rule
    capability_key: customer-accounts
    requirement: GIVEN the user ticks "remember user name" at sign-on THEN the system SHALL store the user name in a cookie lasting 2678400 seconds (31 days); OTHERWISE any existing remember-me cookie SHALL be expired.
    confidence: medium
    confidence_basis: One clear place; the literal 2678400 has a comment saying one month. The cookie is set before authentication outcome is known.
    risk_class: operational
    basis: Cookie bp_signon set with max age, or cleared with max age 0.
    plain_text: If the visitor asks to be remembered, their user name is kept for about a month; if not, any saved name is removed.
    technical_note: Cookie is written regardless of whether authentication succeeds.
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 166
        line_end: 186
        excerpt: |
          if (rememberUserName != null) {
            Cookie userNameCookie = new Cookie(COOKIE_NAME, userName);
            // set cookie to last for one month
            userNameCookie.setMaxAge(2678400);
    stack_metadata:
      framework: servlet-filter
