    requirement: GIVEN a successful sign-on WHEN authentication succeeds THEN the system SHALL mark the session as signed on, record the user name in the session and redirect to the originally requested page; GIVEN a failed sign-on THEN the system SHALL redirect to the configured sign-on error page.
    confidence: medium
    confidence_basis: One clear place; redirect target is the session original URL which may be null if sign-on is submitted directly.
    risk_class: regulated
