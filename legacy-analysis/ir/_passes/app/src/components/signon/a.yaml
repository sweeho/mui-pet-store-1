    kind: requirement
    capability_key: customer-accounts
    requirement: GIVEN a duplicate user name or a failed creation WHEN account creation fails THEN the system SHALL redirect to the user creation error page; the user name is the unique identifier of an account.
    confidence: medium
    confidence_basis: Primary key on user name implies uniqueness; the servlet's success path line is partly unreadable in this pass.
