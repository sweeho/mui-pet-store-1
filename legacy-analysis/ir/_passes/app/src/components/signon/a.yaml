records:
  - record_key: CUST-REQ-0001
    kind: requirement
    capability_key: customer-accounts
    requirement: The system SHALL intercept a request for a protected page from a user who is not signed on and present the sign-on page instead, remembering the originally requested page.
    confidence: medium
    confidence_basis: One clear place (the filter); protected URL list lives in a signon-config file not present in this module, so the exact protected pages are unseen.
    risk_class: regulated
    basis: Filter forwards to sign-on page on exact match of target URL with a protected pattern and stores the original URL in the session; other requests pass through.
    plain_text: Pages that require an account send visitors who have not signed in to the sign-in page, and bring them back to the page they wanted afterwards.
    technical_note: SignOnFilter.doFilter matches by exact string equality (no wildcard) against patterns read by SignOnDAO from /WEB-INF/signon-config.xml.
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 124
        line_end: 154
        excerpt: |
          if (signedOn) {
                  chain.doFilter(request,response);
                  return;
          }
          ...
              if (urlPattern.equals(targetURL)) {
                  hreq.getSession().setAttribute(ORIGINAL_URL,  targetURL);
                  config.getServletContext().getRequestDispatcher("/" + signOnPage).forward(request, response);
    stack_metadata:
      framework: servlet-filter
      session.scope: HttpSession
  - record_key: CUST-REQ-0002
    kind: requirement
    capability_key: customer-accounts
    requirement: The system SHALL authenticate a sign-on attempt by looking up the user by name and comparing the supplied password to the stored password for exact equality; an unknown user name SHALL fail authentication.
    confidence: high
    confidence_basis: Enforced in the session bean and entity bean, and the user guide describes sample users with a password.
    risk_class: regulated
    basis: authenticate returns false on FinderException; matchPassword uses String.equals.
    plain_text: A visitor signs in with a user name and password; sign-in fails if the user does not exist or the password differs.
    technical_note: SignOnEJB.authenticate -> UserEJB.matchPassword. Passwords are stored and compared as plain text (see defect).
