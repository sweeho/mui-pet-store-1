  - record_key: CA-BR-0006
    kind: business-rule
    capability_key: customer-accounts
    requirement: >
      WHEN the user ticks "remember user name" at sign-on, the system SHALL store the user name in a cookie lasting 2678400 seconds (31 days); otherwise the system SHALL expire any existing such cookie.
    confidence: medium
    confidence_basis: >
      One clear place; the duration is a bare literal with a "one month" comment only.
    risk_class: presentational
    basis: Cookie bp_signon with max age 2678400; else existing cookie max age set to 0.
    plain_text: If the customer asks to be remembered, their user name is pre-kept for about a month; if not, any saved name is erased.
    technical_note: SignOnFilter.validateSignOn; cookie set before authentication outcome is known.
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 166
        line_end: 186
        excerpt: |
