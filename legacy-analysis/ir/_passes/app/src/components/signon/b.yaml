    confidence_basis: >
      Filter logic read directly together with the config-driven protected list; sign-on config file itself not inspected here.
    risk_class: regulated
    basis: doFilter forwards to sign-on page and stores original URL; validateSignOn redirects.
    plain_text: Pages that need sign-on send visitors to the sign-in page first and bring them back to the page they wanted once they are signed in.
    technical_note: SignOnFilter; protected URL patterns read from WEB-INF/signon-config.xml by SignOnDAO; match is exact string equality on the path after the context root (no wildcard).
