  - record_key: CA-REQ-0005
    kind: requirement
    capability_key: customer-accounts
    requirement: >
      The system SHALL record a signed-on flag and the user name in the session on successful sign-on, and SHALL treat a session without the flag as not signed on.
    confidence: high
    confidence_basis: >
      Set in validateSignOn and read in doFilter; two places.
    risk_class: regulated
    basis: Session attributes j_signon and j_signon_username.
    plain_text: Once signed on, the customer stays signed on for the rest of the session.
    technical_note: Session attributes SIGNED_ON_USER (Boolean) and USER_NAME. No sign-off or session regeneration in this module.
    interface: false
