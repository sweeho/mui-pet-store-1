records:
  - record_key: CA-REQ-0001
    kind: requirement
    capability_key: customer-accounts
    requirement: >
      The system SHALL authenticate a user by looking up the account by user name and comparing the supplied password with the stored one; an unknown user name or a non-matching password SHALL both result in a failed sign-on.
    confidence: high
    confidence_basis: >
      Enforced in the sign-on session bean (lookup, FinderException mapped to false) and in the user entity's password match; two clear places.
    risk_class: regulated
    basis: authenticate() returns false when the user is not found; matchPassword compares by plain equality.
    plain_text: A customer can sign on only with a known user name and the matching password; anything else is refused.
    technical_note: SignOnEJB.authenticate -> UserLocal.matchPassword (String.equals on stored password, which is stored in clear).
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 78
        excerpt: |
              public boolean authenticate(String userName, String password) {
                  try {
                      UserLocal user = ulh.findByPrimaryKey(userName);
                      return user.matchPassword(password);
                  } catch (FinderException fe) {
                      return false; // User not found, so authentication failed.
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 79
        line_end: 81
        excerpt: |
              public boolean matchPassword(String password) {
                  return password.equals(getPassword());
              }
    stack_metadata:
      framework: EJB 2.x
      ejb.bean: SignOnEJB, UserEJB
