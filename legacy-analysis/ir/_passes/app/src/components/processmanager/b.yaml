    path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionDelegate.java
    description: TransitionDelegate/TransitionInfo/Factory define a pluggable transition hook, but no implementation or caller exists in this module; reachability and allowed status transitions must be established from callers elsewhere.
