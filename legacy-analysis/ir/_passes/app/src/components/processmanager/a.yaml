  - record_key: ORDF-BR-0001
    kind: business-rule
    capability_key: order-fulfilment
    requirement: The system SHALL use the order statuses PENDING, APPROVED, DENIED, SHIPPED_PART and COMPLETED, where an order moves PENDING to APPROVED to SHIPPED_PART to COMPLETED, or PENDING to DENIED.
    confidence: medium
    confidence_basis: Stated in a class comment and constants; the transitions are not enforced in this module, so the order is documented intent only.
    risk_class: operational
    basis: OrderStatusNames lists the statuses and the comment gives the lifecycle.
    plain_text: An order is pending, then approved, then partly shipped, then completed; or it is denied straight from pending.
    technical_note: String constants in OrderStatusNames; no enforcement of allowed transitions in ProcessManagerEJB.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 44
        line_end: 65
        excerpt: |
          * pending->approved->shippedPart(shipped part of order)->completed(whole order shipped)  or
          * pending->denied
          public static final String PENDING = "PENDING";
    stack_metadata:
      framework: EJB 2.x
