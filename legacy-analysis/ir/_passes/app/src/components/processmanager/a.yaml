  - record_key: ORDF-REQ-0001
    kind: requirement
    capability_key: order-fulfilment
    requirement: The system SHALL create a process-tracking record with a supplied initial status when a new purchase order is received to start its fulfilment workflow.
    confidence: medium
    confidence_basis: One clear place (createManager); the callers are in other modules and were not read.
    risk_class: operational
    basis: createManager creates a Manager with the order id and status passed in; no validation of the status value.
    plain_text: When a new order arrives, the system starts tracking it with a starting status.
    technical_note: ProcessManagerEJB.createManager delegates to ManagerLocalHome.create. Status is not validated against the known status names.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 62
        line_end: 68
        excerpt: |
          public void createManager(String orderId, String status) throws CreateException {
            ManagerLocal manager = mlh.create(orderId, status);
          }
    stack_metadata:
      ejb.bean: ProcessManagerEJB
      ejb.transaction: Required
  - record_key: ORDF-REQ-0002
    kind: requirement
    capability_key: order-fulfilment
    requirement: The system SHALL allow the status of an existing order's tracking record to be replaced with a new status, and SHALL allow the current status to be read back.
    confidence: medium
    confidence_basis: One clear place; the status is set unconditionally, so no transition rules are enforced here.
    risk_class: operational
    basis: updateStatus finds by order id and sets status; getStatus returns it. A missing order raises a finder exception.
    plain_text: The stage of an order can be updated and looked up at any time; an unknown order is reported as an error.
    technical_note: ProcessManagerEJB.updateStatus/getStatus via findByPrimaryKey. No check of the previous status.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 70
        line_end: 84
        excerpt: |
          public void updateStatus(String orderId, String status) throws FinderException {
            ManagerLocal manager = mlh.findByPrimaryKey(orderId);
            manager.setStatus(status);
          }
    stack_metadata:
      ejb.bean: ProcessManagerEJB
      ejb.transaction: Required
