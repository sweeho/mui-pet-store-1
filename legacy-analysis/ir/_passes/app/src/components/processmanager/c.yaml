    risk_class: operational
    basis: findOrdersByStatus EJB-QL query exposed as getOrdersByStatus.
    plain_text: The system can list every order currently in a given status, such as all pending orders.
    technical_note: EJB-QL SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1.
