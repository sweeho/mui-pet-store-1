        line_start: 61
        line_end: 63
        excerpt: |
          public String ejbCreate(String orderId, String status) throws CreateException {
              setOrderId(orderId);
              setStatus(status);
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: ManagerEJB
      ejb.transaction: Required
  - record_key: ORDF-REQ-0002
    kind: requirement
    capability_key: order-fulfilment
    requirement: >
      The system SHALL allow an order's tracking record to be created with an initial status, read, and have its status replaced with a new value by order id.
    confidence: medium
    confidence_basis: One clear place (the session bean); behaviour is simple pass-through, callers not examined in this pass.
    risk_class: operational
    basis: Session facade exposes createManager, updateStatus and getStatus delegating to the entity.
    plain_text: The system can record an order's status when the order is first tracked, look it up, and change it later.
    technical_note: ProcessManagerEJB stateless session bean, all methods trans-attribute Required. updateStatus and getStatus throw FinderException for an unknown order id; no check that the new status is a known value.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 66
        line_end: 67
        excerpt: |
          public void createManager(String orderId, String status) throws CreateException {
                ManagerLocal manager = mlh.create(orderId, status);
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 73
        line_end: 75
        excerpt: |
          public void updateStatus(String orderId, String status) throws FinderException {
                ManagerLocal manager = mlh.findByPrimaryKey(orderId);
                manager.setStatus(status);
    stack_metadata:
      ejb.bean: ProcessManagerEJB
      ejb.transaction: Required
