  - record_key: ORDF-BR-0004
    kind: business-rule
    capability_key: order-fulfilment
    requirement: >
      The system SHALL recognise the order statuses PENDING, APPROVED, DENIED, SHIPPED_PART and COMPLETED.
    confidence: medium
    confidence_basis: Constants are one clear place; user guide and runbook corroborate four of five statuses, but SHIPPED_PART appears in no document and its use is outside this module.
    risk_class: operational
    basis: Status name constants; documents define PENDING, APPROVED, DENIED, COMPLETED meanings.
    plain_text: An order is always in one of these states - pending, approved, denied, partly shipped or completed.
    technical_note: OrderStatusNames string constants. Status is stored as a free String; nothing in this module restricts values or transitions.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 51
        line_end: 65
        excerpt: |
          public static final String PENDING = "PENDING";
          public  static final String SHIPPED_PART = "SHIPPED_PART";
          public  static final String COMPLETED = "COMPLETED";
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: p1 (section 5, Order status)
        excerpt: |
          PENDINGWaiting for the administrator to approve or deny
          COMPLETEDAll lines shipped and invoiced
    stack_metadata:
      framework: EJB 2.0
  - record_key: ORDF-REQ-0005
    kind: requirement
    capability_key: order-fulfilment
    requirement: >
      GIVEN a configured transition handler name WHEN a status transition is performed THEN the system SHALL instantiate the named handler and pass it the XML message (or batch of messages) for the transition, and SHALL report any failure to instantiate as a transition error.
    confidence: low
    confidence_basis: Only the factory, interface and carrier class exist; no caller found within this module, so reachability is unknown.
    dispute:
      reason: unresolved-reachability
      detail: No use of TransitionDelegate was found in this module; settled by finding a caller or config naming a handler class in other modules.
    risk_class: operational
    basis: Reflective delegate factory with setup/doTransition contract.
    plain_text: The system can run a pluggable handler for an order transition, and fails with a transition error if the handler cannot be created.
    technical_note: Class.forName(className).newInstance() wrapped into TransitionException.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionDelegateFactory.java
        line_start: 50
        line_end: 54
        excerpt: |
          try {
            td = (TransitionDelegate)Class.forName(className).newInstance();
          } catch(Exception e) {
            throw new TransitionException(e);
          }
    stack_metadata:
      framework: EJB 2.0
