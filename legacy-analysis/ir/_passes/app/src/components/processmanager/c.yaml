records:
  - record_key: ORDF-ENT-0001
    kind: entity
    capability_key: order-fulfilment
    requirement: >
      The system SHALL keep exactly one process-manager record per order, keyed by order id, holding the order's current status.
    confidence: high
    confidence_basis: >
      Declared in the descriptor (primary key field, two persistent fields) and mirrored by the bean's abstract accessors and create method.
    risk_class: operational
    basis: Container-managed entity with orderId as primary key and a status field.
    plain_text: Each order has a single tracking record that stores its current status.
    technical_note: ManagerEJB CMP 2.x entity, abstract schema Manager, prim-key String.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/ejb-jar.xml
        line_start: 65
