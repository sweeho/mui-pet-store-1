suspected_defects:
  - capability_key: order-approval
    record_keys: [order-approval-RULE-0001]
    severity: medium
    category: contradicts-document
    title: Boundary at exactly 500 / 50000 and mixed currencies
    description: >
      Code approves only strictly below the limit; the user guide says orders under 500 are approved and pending is "greater than 500", leaving exactly 500 undefined in the documents (code leaves it PENDING). Limits are compared against raw total price with no conversion despite the "stub for converting currency" comment.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 186
        line_end: 188
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        line_start: 65
        line_end: 65
        anchor: 3.3 Approving or denying orders
  - capability_key: order-notifications
    record_keys: [order-notifications-RULE-0001]
    severity: low
    category: contradicts-document
    title: Admin guide env-entry names differ from the ones in code
    description: >
      The admin guide lists param/SendApprovalMailOrder, SendConfirmationMailOrder and SendCompletedOrderMailOrder; the code reads param/SendApprovalMail, SendConfirmationMail and SendCompletedOrderMail. Following the guide would not enable mail.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/JNDINames.java
        line_start: 57
        line_end: 71
      - path: legacy-analysis/sources/pdf/petstore-admin-guide/extracted.md
        line_start: 32
        line_end: 34
        anchor: 3.1 E-mail notifications
  - capability_key: order-approval
    record_keys: [order-approval-WF-0001]
    severity: medium
    category: error-swallowed
    title: Approval message handling failures only rethrown as EJBException
    description: >
      An unknown order or malformed message in OrderApprovalMDB makes the whole batch fail and be redelivered, so one bad order can block approvals for the others in the same message; the first PENDING-order status update is not undone for orders already processed unless the container transaction rolls back.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 151
        line_end: 164
findings: []
