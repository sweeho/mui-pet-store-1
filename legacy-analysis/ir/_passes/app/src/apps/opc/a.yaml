      The system SHALL provide the admin client a listing of purchase orders by status giving, for each, order id, user id, order date (month/day/year), order value and status.
    plain_text: >
      Administrators can list orders in a given status and see order number, customer, date, value and status.
    technical_note: >
      OPCAdminFacadeEJB.getOrdersByStatus uses ProcessManager.getOrdersByStatus then loads each PO; date formatted by hand from deprecated Date getters.
    interface: true
