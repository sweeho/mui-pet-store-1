    plain_text: >
      Administrators can see sales between two dates as revenue or units sold, by category and then by item within a category.
    technical_note: >
      OPCAdminFacadeEJB.getChartInfo; revenue accumulated in Float, so rounding is binary floating point. Not described in any guide.
