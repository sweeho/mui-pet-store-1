  - record_key: order-notifications-RULE-0002
    kind: business-rule
    capability_key: order-notifications
    requirement: >
      The system SHALL address each order e-mail to the e-mail address stored on the purchase order, render its body in the locale stored on the purchase order, and use the subject "Java Pet Store Order Status: <order id>" for status changes, "Java Pet Store Order Shipped: <order id>" for invoices and "Java Pet Store Order COMPLETED: <order id>" for completion.
    plain_text: >
      Order e-mails go to the address given on the order, in the customer's language, with a subject that names the kind of update and the order number.
    technical_note: >
      Mail MDBs look up the PO, use LocaleUtil.getLocaleFromString(po.getPoLocale()) and an XSL stylesheet (MailContentXDE, rsrc/xsl/*_en_US, ja_JP, zh_CN) to produce HTML, wrapped in a Mail XML message for the mailer.
    interface: true
    confidence: high
    confidence_basis: Same pattern in three beans, plus per-locale stylesheets present.
    risk_class: presentational
    basis: Mail MDB doWork methods and MAIL_SUBJECT constants.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/MailOrderApprovalMDB.java
        line_start: 168
        line_end: 176
        excerpt: |
          String subject = MAIL_SUBJECT +  co.getOrderId();
          po = poHome.findByPrimaryKey(co.getOrderId());
          String emailAddress = po.getPoEmailId();
          mailContentXDE.setDocument(new DOMSource(co.toDOM()));
          mailContentXDE.setLocale(LocaleUtil.getLocaleFromString(po.getPoLocale()));
