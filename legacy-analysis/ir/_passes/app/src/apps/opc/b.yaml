    path: legacy-source/app/src/apps/opc/src/ejb-jar.xml
    description: >
      Env-entry values (mail flags, XML validation flags) are redacted in the source copy, so the shipped defaults cannot be confirmed from code; only the admin guide says mail is disabled by default.
