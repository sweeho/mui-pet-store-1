suspected_defects:
  - capability_key: order-approval
    record_keys: [order-approval-REQ-0001, order-approval-REQ-0006]
    severity: low
    category: contradicts-document
    title: Boundary at exactly 500 differs in wording between guide and code
    description: >
      User guide says an order is pending if its total is greater than $500 and approved automatically if less than $500; code approves only when total is strictly below the limit, so a total of exactly 500 (or 50000) is PENDING. The guide's wording leaves exactly-500 undefined.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 186
        line_end: 188
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        line_start: 65
        line_end: 65
        kind: document
        anchor: p1
  - capability_key: order-approval
    record_keys: [order-approval-REQ-0001]
    severity: medium
    category: other
    title: One user-guide statement says orders under 500 approve regardless of region
    description: >
      The guide states a single $500 limit; code applies 50000 for Japan and holds all other locales pending, so a 600-yen-equivalent order from other locales behaves differently than documented.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        line_start: 52
        line_end: 53
        kind: document
        anchor: p1
  - capability_key: order-notifications
    record_keys: [order-notifications-REQ-0002]
    severity: low
    category: other
    title: Locale string parser never reads the variant
    description: >
      LocaleUtil.getLocaleFromString computes variantIndex as -1 and never updates it, so a variant is never applied; country is null when the string has two underscores. Mail locale for such strings falls back unexpectedly.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/LocaleUtil.java
        line_start: 53
        line_end: 73
  - capability_key: order-approval
    record_keys: [order-approval-REQ-0006]
    severity: low
    category: other
    title: Decision status not validated
    description: >
      OrderApprovalMDB writes whatever status string the message carries to the workflow, only APPROVED triggers a supplier order; any other value (not just DENIED) is recorded.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 180
        line_end: 190
findings:
