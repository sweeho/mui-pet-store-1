suspected_defects:
  - capability_key: order-approval
    record_keys: [ORDAPP-RULE-0001, ORDAPP-RULE-0002]
    severity: medium
    category: contradicts-document
    title: Order at exactly 500 and non-US/JP regions handled differently from the user guide
    description: >
      The user guide says orders "less than $500" are approved automatically and pending orders are those "greater than $500", leaving an order of exactly 500 undefined; the code leaves exactly 500 pending. The guide also ignores the Japan limit and locales other than US and Japan, which the code never auto-approves.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 186
        line_end: 188
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        line_start: 65
        line_end: 65
        anchor: p1
  - capability_key: order-fulfilment
    record_keys: [ORDFUL-INT-0001, ORDAPP-RULE-0003]
    severity: low
    category: other
    title: Approval status value is not validated
    description: >
      OrderApprovalMDB stores whatever status string arrives for a PENDING order; only the exact value APPROVED triggers a supplier order. A message with any other value (not DENIED) would move the order out of PENDING with no fulfilment.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 209
        line_end: 222
  - capability_key: order-notifications
    record_keys: [ORDNOT-RULE-0001]
    severity: low
    category: contradicts-document
    title: SendConfirmationMail comment says completion, code uses it for shipment
    description: >
      The JNDI constant comment says SendConfirmationMail governs mail when an order is completed, but it governs MailInvoiceMDB (per-shipment invoice); completion mail uses SendCompletedOrderMail. The admin guide labels it "confirmation".
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/JNDINames.java
        line_start: 52
        line_end: 58

