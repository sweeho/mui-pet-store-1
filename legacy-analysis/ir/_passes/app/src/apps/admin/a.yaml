    requirement: The system SHALL present a login screen asking for user ID and password, and an entry page offering a Launch Rich Client action and a logout action.
    confidence: medium
    confidence_basis: One clear place per screen (JSP files); no tests.
    risk_class: presentational
    basis: login.jsp form posts to j_security_check; index.jsp has forms posting to AdminRequestProcessor.
    plain_text: Administrators see a sign-in page and then a start page from which they can launch the order management client or sign out.
    technical_note: login.jsp prefills j_username=jps_admin and j_password=admin (see suspected defects). index.jsp forms post currentScreen values handled by AdminRequestProcessor.
