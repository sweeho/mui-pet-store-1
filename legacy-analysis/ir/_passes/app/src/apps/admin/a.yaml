  - record_key: ADMIN-REQ-0003
    kind: requirement
    capability_key: admin-order-management
    requirement: The system SHALL allow logout, ending the administrator's session, via the logout action.
    confidence: low
    confidence_basis: Only the dispatch to logout.jsp was read; the page body was not examined for session invalidation.
    risk_class: operational
    basis: doPost forwards to /logout.jsp when currentScreen is logout.
    plain_text: Administrators can sign out.
    technical_note: AdminRequestProcessor forwards to logout.jsp; after forwarding, execution continues to the next if-block (harmless since values differ).
    interface: false
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 109
        line_end: 111
        excerpt: |
          if(curScreen.equals("logout")) {
              getServletConfig().getServletContext().getRequestDispatcher("/logout.jsp").forward(req, resp);
          }
    stack_metadata:
      jsp.page: logout.jsp
