records:
  - record_key: ADMIN-REQ-0001
    kind: requirement
    capability_key: admin-order-management
    requirement: The system SHALL restrict the order-administration endpoint to authenticated users holding the administrator role, signing them in through a form-based login page.
    confidence: high
    confidence_basis: Declared in web.xml and repeated in application.xml, plus the login page and the user guide.
    risk_class: regulated
    basis: web.xml security constraint with administrator auth-constraint and FORM login; role declared in application.xml.
    plain_text: Only signed-in administrators may use the order administration area; others are sent to a login page.
    technical_note: web.xml security-constraint on /AdminRequestProcessor (GET, POST), FORM login /login.jsp, error /error.jsp. The rich-client endpoint /ApplRequestProcessor is NOT in the constraint and relies on a session check instead (see suspected defects).
    interface: false
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 88
        excerpt: |
          <security-constraint>
          <auth-constraint>
          <role-name>administrator</role-name>
      - path: legacy-source/app/src/apps/admin/src/application.xml
        line_start: 55
        line_end: 57
        excerpt: |
          <security-role>
          <role-name>administrator</role-name>
          </security-role>
    stack_metadata:
      framework: servlet
      session.scope: container form login
