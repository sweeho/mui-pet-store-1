  - record_key: ADMIN-RULE-0001
    kind: business-rule
    capability_key: order-approval
    requirement: The system SHALL treat an order as awaiting administrator action when its status is PENDING, which the user documents define as an order whose total exceeds the region limit (US 500).
    confidence: low
    confidence_basis: The limit is not applied in the admin module; it comes from documents only and the client merely lists orders by status.
    risk_class: financial
    basis: User guide states "pending if total value greater than $500"; runbook gives US 500 / JP 50000. Admin code has no threshold.
    plain_text: Large orders (over $500 in the US, 50,000 in Japan) wait for an administrator to approve or deny them.
    technical_note: Threshold enforced in the order-processing module, outside this shard; recorded here from documents.
    interface: false
    traces:
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: p1 (section 3.3 Approving or denying orders)
        excerpt: |
          An order is pending if its total value is greater than $500.
