  - record_key: ADMIN-WF-0001
    kind: workflow
    capability_key: admin-order-management
    requirement: WHEN the administrator chooses to manage orders, the system SHALL return a Java Web Start launch descriptor that starts the rich client against the same server and the administrator's current session.
    confidence: medium
    confidence_basis: One clear place (servlet buildJNLP), corroborated by user guide description of launching.
    risk_class: operational
    basis: doPost on currentScreen=manageorders writes a JNLP document with the session id as an argument.
    plain_text: Clicking the launch button downloads a small file that opens the desktop order management tool, already signed in.
    technical_note: AdminRequestProcessor.buildJNLP; codebase built from request server name and port, path /admin; session id passed as a program argument so the client can reuse the authenticated session.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 112
        line_end: 118
