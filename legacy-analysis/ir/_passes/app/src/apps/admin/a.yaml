findings:
  - kind: ambiguity
    path: legacy-source/app/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/PetStoreAdminClient.java
    description: Rich client UI details (i18n bundles petstore.properties, petstore_de.properties, table sorting, status bar) were not extracted; a German bundle exists though documents mention only English/Japanese/Chinese. A human should decide whether the admin client localisation is in scope.
suspected_defects:
  - capability_key: admin-order-management
    record_keys: [ADMIN-REQ-0001, ADMIN-REQ-0004]
    severity: high
    category: other
    title: Rich-client endpoint not covered by the security constraint
    description: >
      web.xml constrains only /AdminRequestProcessor to the administrator role. /ApplRequestProcessor, which reads and changes order status, is protected only by a check that some session exists, so any signed-in session (or any container-created session) is accepted regardless of role. The transport guarantee is NONE (no TLS).
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 78
        line_end: 86
        excerpt: |
          <url-pattern>/AdminRequestProcessor</url-pattern>
          <transport-guarantee>NONE</transport-guarantee>
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 94
        line_end: 94
        excerpt: |
