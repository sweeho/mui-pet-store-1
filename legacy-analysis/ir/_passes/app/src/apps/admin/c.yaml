  - record_key: ADM-WFL-0001
    kind: workflow
    capability_key: admin-order-management
    requirement: The system SHALL offer the signed-in administrator a "Launch Rich Client" action that delivers a Java Web Start descriptor targeting the current host, port and session id, and a "logout" action that ends the session.
    confidence: high
    confidence_basis: Code in the servlet, the launch page form and the user guide agree.
    risk_class: operational
    basis: doPost dispatches on the currentScreen parameter; index.jsp posts manageorders and logout.
    plain_text: From the admin home page the administrator can start the order-management application on their desktop or sign out.
    technical_note: AdminRequestProcessor.doPost; "manageorders" emits JNLP (application/x-java-jnlp-file) with main class PetStoreAdminClient, proxy HttpPostPetStoreProxy, server name, port and session id; "logout" forwards to logout.jsp. A missing currentScreen parameter returns with no output; unknown values produce no output.
    interface: true
