suspected_defects:
  - capability_key: admin-order-management
    record_keys: [ADM-REQ-0001, ADM-RULE-0001]
    severity: high
    category: other
    title: Order data servlet is not protected by the administrator role
    description: >
      The security constraint covers only the launch servlet. The data servlet that lists orders and applies approvals is mapped separately, with no role constraint; it only checks that a session exists. The rich client even sends a hard-coded dummy session header.
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 88
      - path: legacy-source/app/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/HttpPostPetStoreProxy.java
        line_start: 105
        line_end: 105
  - capability_key: admin-order-management
    record_keys: [ADM-REQ-0003, ADM-REQ-0004]
    severity: medium
    category: error-swallowed
    title: Backend failures return an empty response
    description: >
      When the order or report lookup fails, the exception is printed and null is returned, so the client receives an empty reply rather than an error message; the null-orders case does the same. Update failures, by contrast, return an Error element.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 172
        line_end: 202
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 301
        line_end: 303
  - capability_key: order-approval
    record_keys: [ADM-INT-0002]
    severity: medium
    category: other
    title: Submitted order status is not validated
    description: >
      Any status string is forwarded for any order id, so the update is not limited to pending orders or to APPROVED/DENIED; the server relies on the client UI to restrict choices.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 205
        line_end: 237
  - capability_key: admin-order-management
    record_keys: [ADM-REQ-0001]
    severity: medium
    category: other
    title: Login form prefilled with default credentials, and no transport encryption
    description: >
      The login page pre-populates the user id and password, and the security constraint states a transport guarantee of NONE.
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/login.jsp
        line_start: 60
        line_end: 66
        excerpt: |
          <input type="password" size="15" name="j_password" value="admin">
findings:
  - kind: ambiguity
    path: legacy-source/app/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/HttpPostPetStoreProxy.java
    description: >
      The client sends a JSESSIONID request property with a literal dummy value while the JNLP passes the real session id as argument; how the session is actually attached to requests (cookie handling) was not established. A human or runtime test should confirm.
