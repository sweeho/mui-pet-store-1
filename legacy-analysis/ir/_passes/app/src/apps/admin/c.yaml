    kind: requirement
    capability_key: admin-order-management
    requirement: The system SHALL restrict the admin launch page and order-management console access to authenticated users holding the administrator role, using a form-based sign-in.
    confidence: medium
    confidence_basis: One declarative place (web.xml) plus the login page; but the constraint covers only one of the two servlets, so the full protection picture is not established.
    risk_class: regulated
    basis: web.xml defines an administrator-only security constraint with FORM login on the launch servlet.
    plain_text: Only signed-in administrators can reach the admin page where orders are managed.
    technical_note: web.xml security-constraint on /AdminRequestProcessor (GET and POST), role administrator, FORM login /login.jsp, error /error.jsp. The data servlet /ApplRequestProcessor has no constraint (see suspected defect).
    interface: false
    traces:
