  - record_key: ADMIN-REQ-0006
    kind: requirement
    capability_key: admin-order-management
    requirement: The system SHALL reject rich-client requests that carry no existing session with the message "Session Timed Out; Please exit and login as admin from the login page", and reply with an error for unknown request types.
    confidence: medium
    confidence_basis: One handler; documents silent on it.
    risk_class: operational
    basis: ApplRequestProcessor.doPost checks getSession(false); processRequest returns an Error element for unknown types.
    plain_text: If the administrator's session has expired the tool tells them to log in again.
    technical_note: Session timeout is 54 minutes (web.xml, bare literal). Only presence of a session is checked, not the administrator role.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 369
        line_end: 373
        excerpt: |
          if(session == null) {
              out.println(replyHeader + "<Error>Session Timed Out; Please exit and " +
                          "login as admin from the login page</Error>\n" +
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 67
        line_end: 69
        excerpt: |
          <session-config>
            <session-timeout>54</session-timeout>
    stack_metadata:
