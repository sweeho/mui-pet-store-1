findings: []
suspected_defects:
  - capability_key: admin-order-management
    record_keys: [ADMIN-SCR-0001]
    severity: high
    category: other
    title: Login form pre-filled with default admin credentials
    description: The login page pre-populates the user ID jps_admin and password admin.
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/login.jsp
        line_start: 60
        line_end: 66
  - capability_key: admin-order-management
    record_keys: [ADMIN-REQ-0006, ADMIN-REQ-0001]
    severity: high
    category: other
    title: Rich-client endpoint is not role-protected
    description: Only /AdminRequestProcessor is under the security constraint; /ApplRequestProcessor, which reads and changes orders, checks only that some session exists, and the client sends a dummy JSESSIONID header.
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 88
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 363
        line_end: 374
  - capability_key: order-approval
    record_keys: [ADMIN-REQ-0003]
    severity: medium
    category: other
    title: Submitted status values are not validated
    description: UPDATESTATUS forwards any status string to the order centre, and replies SUCCESS on hand-off regardless of outcome; client checks for failure but throws nothing.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 491
        line_end: 498
      - path: legacy-source/app/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/HttpPostPetStoreProxy.java
        line_start: 415
        line_end: 417
  - capability_key: admin-order-management
    record_keys: [ADMIN-REQ-0002, ADMIN-REQ-0005]
    severity: medium
    category: error-swallowed
    title: Backend failures return null and an empty response
    description: getOrders and getChartInfo catch the delegate exception, print the stack and return null, so the client receives an empty body.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 474
        line_end: 477
  - capability_key: admin-order-management
    record_keys: [ADMIN-REQ-0005]
    severity: low
    category: inconsistent-rounding
    title: Revenue total summed in single-precision floats
    description: Revenue amounts and the total are float, so totals can drift from exact currency sums.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 541
        line_end: 546
