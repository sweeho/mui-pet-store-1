  - record_key: ADMIN-ENT-0001
    kind: entity
    capability_key: order-fulfilment
    requirement: The system SHALL treat an order's status as one of PENDING, APPROVED, DENIED or COMPLETED.
    confidence: medium
    confidence_basis: Constants in client code; the authoritative lifecycle is in another module. The validation routine is a no-op.
    risk_class: operational
    basis: PetStoreProxy.Order constants; the admin documentation says orders stay PENDING until an admin approves or denies them.
    plain_text: Every order is pending, approved, denied or completed.
    technical_note: checkStatus compares strings by reference and has an empty body.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/PetStoreProxy.java
        line_start: 46
        line_end: 50
        excerpt: |
          public final static String PENDING = "PENDING";
          public final static String DENIED = "DENIED";
          public final static String APPROVED = "APPROVED";
          public final static String COMPLETED = "COMPLETED";
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        line_start: 25
        line_end: 25
        excerpt: |
          otherwise                              --> PENDING until the Admin client approves or denies
    stack_metadata:
