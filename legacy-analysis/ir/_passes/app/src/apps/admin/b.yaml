  - record_key: ADMIN-REQ-0005
    kind: requirement
    capability_key: admin-order-management
    requirement: The system SHALL provide sales reports of REVENUE or ORDERS (quantity) between a start and end date, grouped by category or, when a category is requested, by item within it, with a grand total, shown as pie or bar charts.
    confidence: medium
    confidence_basis: Server handler and client labels; the aggregation itself lives in another module and was not seen.
    risk_class: financial
    basis: getChartInfo calls the facade with request type, dates and optional category; element name is Category when no category else Item; total is summed in TotalSales.
    plain_text: Administrators can chart total sales amount or number of orders over a date range by category, and drill into a category to see items.
    technical_note: Dates are MM/dd/yyyy strings parsed with StringTokenizer. Revenue summed as float.
