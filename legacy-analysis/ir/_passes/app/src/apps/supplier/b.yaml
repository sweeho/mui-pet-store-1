records:
  - record_key: OF-WF-0001
    kind: workflow
    capability_key: order-fulfilment
    requirement: >
      The system SHALL accept a supplier purchase order as an XML text message from the purchase order queue, persist it,
      attempt to fulfil it, and publish any resulting invoice to the invoice topic.
    confidence: high
    confidence_basis: >
      Message listener, facade and transition delegate all read in this pass, plus the user guide describing the flow.
    risk_class: operational
    basis: The order listener passes the text to the fulfilment facade, which persists the order and processes it; a non-empty invoice is sent on.
    plain_text: >
      When the order processing centre sends the supplier a purchase order, the supplier stores it, ships what it can, and sends back an invoice.
    technical_note: >
      SupplierOrderMDB.onMessage -> OrderFulfillmentFacadeEJB.processPO (create SupplierOrder then processAnOrder) -> SupplierOrderTD.doTransition publishes to invoice topic via TopicSender.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 113
        excerpt: |
          (see onMessage: getText, doWork, doTransition(invoice) when invoice != null)
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 223
        line_end: 237
        excerpt: |
          supplierOrderXDE.setDocument(poXmlDoc);
          supplierOrder = supplierOrderXDE.getSupplierOrder();
          order = supplierOrderLocalHome.create(supplierOrder);
          invoiceXml = processAnOrder(order);
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/transitions/SupplierOrderTD.java
        line_start: 76
        line_end: 83
        excerpt: |
          invoiceTopicSender.sendMessage(xmlInvoice);
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        line_start: 18
        line_end: 19
        excerpt: "Supplier: Stock clerk. Fulfils OPC orders from inventory and invoices the OPC"
    stack_metadata:
      framework: EJB 2.0 MDB
      ejb.bean: SupplierOrderMDB, OrderFulfillmentFacadeEJB
      jms.queue: jms/supplier/PurchaseOrderQueue
  - record_key: OF-BR-0001
    kind: business-rule
    capability_key: order-fulfilment
    requirement: >
      The system SHALL ship a purchase order line in full only when inventory on hand for the item is at least the line quantity, and SHALL then reduce inventory by that quantity and set the line's shipped quantity to the line quantity.
    confidence: high
    confidence_basis: Enforced in the facade check plus the inventory bean's reduce operation; user guide describes inventory-driven fulfilment.
    risk_class: operational
    basis: checkInventory compares quantity, reduces stock; processAnOrder marks shipped. No partial-line shipment.
    plain_text: A line is shipped only if there is enough stock for the whole line; otherwise it waits. Lines are never part-shipped.
    technical_note: OrderFulfillmentFacadeEJB.checkInventory and processAnOrder; InventoryEJB.reduceQuantity.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          if(inv.getQuantity() < item.getQuantity())
            return(false);
          inv.reduceQuantity(item.getQuantity());
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 185
        line_end: 196
        excerpt: |
          if(li.getQuantity() == li.getQuantityShipped())
            continue;
          if(!checkInventory(li)) {
            allItemsAvailable = false;
            continue;
          }
          li.setQuantityShipped(li.getQuantity());
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB, InventoryEJB
  - record_key: OF-BR-0002
    kind: business-rule
    capability_key: order-fulfilment
    requirement: >
      GIVEN an inventory record does not exist for an ordered item WHEN the line is processed THEN the system SHALL treat the line as unavailable and leave the order unfulfilled for that line, without raising an error.
    confidence: high
    confidence_basis: Explicit catch with comment explaining intent, in a single place.
    risk_class: operational
    basis: FinderException is swallowed and false returned, meaning supplier not populated.
    plain_text: An item the supplier has no stock record for is simply treated as out of stock.
    technical_note: checkInventory catches FinderException.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 132
        line_end: 137
        excerpt: |
