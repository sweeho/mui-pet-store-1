  - record_key: OF-BR-0003
    kind: business-rule
    capability_key: order-fulfilment
    requirement: >
      The system SHALL mark a purchase order COMPLETED only when every one of its lines was available (already shipped or shipped in this pass); otherwise the order SHALL keep its prior status (pending).
    confidence: high
    confidence_basis: Single code path, matches user guide status table (COMPLETED = all lines shipped and invoiced).
    risk_class: operational
    basis: allItemsAvailable flag drives setPoStatus(COMPLETED).
    plain_text: An order is complete only once all of its lines have shipped.
    technical_note: processAnOrder; OrderStatusNames.COMPLETED/PENDING.
    interface: false
    traces:
