suspected_defects:
  - capability_key: order-fulfilment
    record_keys: [OF-BR-0006]
    severity: medium
    category: error-swallowed
    title: Invoice failure after stock deduction is swallowed
    description: >
      Stock is reduced and lines marked shipped before the invoice is built; if building fails the error is printed and null returned, so the shipment is never invoiced later.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 187
        line_end: 207
  - capability_key: order-fulfilment
    record_keys: [OF-REQ-0001, OF-BR-0005]
    severity: medium
    category: error-swallowed
    title: Servlet swallows transaction and lookup failures
    description: >
      All exceptions in the update action are printed; the transaction is not rolled back explicitly and the user gets no response page on failure.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 190
        line_end: 206
  - capability_key: order-fulfilment
    record_keys: [OF-REQ-0001]
    severity: low
    category: other
    title: Servlet doGet toggles shared instance field
    description: >
      The fromDoGet flag is an instance field on a shared servlet, so concurrent requests may see each other's value; also a post with unknown currentScreen produces no response.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 159
        line_end: 177
