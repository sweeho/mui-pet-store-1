  - record_key: OF-BR-0005
    kind: business-rule
    capability_key: order-fulfilment
    requirement: >
      The system SHALL, when stock is changed, re-process all purchase orders in PENDING status and send an invoice for each that shipped something, within the same transaction as the stock update.
    confidence: high
    confidence_basis: Servlet code plus user guide statement about OPC re-checking after update.
    risk_class: operational
    basis: updateinventory screen action runs updateInventory, processPendingPO and sendInvoices between ut.begin and ut.commit.
    plain_text: After the stock clerk saves new quantities, waiting orders are retried and invoiced automatically.
    technical_note: RcvrRequestProcessor.doPost with UserTransaction; OrderFulfillmentFacadeEJB.processPendingPO.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 179
        line_end: 189
        excerpt: |
          ut.begin();        // start the xaction.
          updateInventory(req);
          Collection invoices = procPO.processPendingPO();
          sendInvoices(invoices);
          ut.commit();        // end xaction
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 247
        line_end: 269
        excerpt: |
          supplierOrderLocalHome.findOrdersByStatus(OrderStatusNames.PENDING);
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        line_start: 76
        line_end: 77
        excerpt: "After every update the Supplier notifies the OPC. The OPC checks whether it can now fulfil orders it could not fulfil before, and marks those orders completed."
    stack_metadata:
      framework: servlet
      ejb.transaction: UserTransaction (bean-managed)
      jms.queue: invoice topic
  - record_key: OF-BR-0006
    kind: business-rule
    capability_key: order-fulfilment
    requirement: >
      GIVEN invoice generation fails for an order WHEN the order is processed THEN the system SHALL keep the order persisted with the stock already deducted and lines marked shipped, return no invoice, and not raise an error.
    confidence: medium
    confidence_basis: One clear place with explanatory comment; consequence for stock is inferred from statement order.
    risk_class: financial
    basis: processAnOrder catches XMLDocumentException after inventory was already reduced and lines marked shipped.
    plain_text: If an invoice cannot be produced, the order is kept and no invoice goes out.
    technical_note: processAnOrder catch block prints to stdout and returns null; the order is not re-invoiced later since lines are already shipped.
