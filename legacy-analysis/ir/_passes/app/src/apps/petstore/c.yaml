  - record_key: CHK-REQ-0002
    kind: business-rule
    capability_key: checkout-and-payment
    requirement: >
      The system SHALL build the order from the cart lines, valuing each line as unit cost times quantity and the order total as the sum, numbering lines from 0, tagging the order with the shopper's current locale, and assign the order a unique id generated from the seed "1001".
    plain_text: >
      An order records each cart line with its price and quantity, the total, the shopper's language and a unique order number.
    technical_note: >
      OrderEJBAction accumulates a float totalCost; each line cost is parsed from item.getUnitCost() as float. Id from UniqueIdGeneratorLocal.getUniqueId("1001").
    interface: false
    confidence: medium
    confidence_basis: >
      One clear place. The meaning of the seed "1001" is a bare literal.
    risk_class: financial
    basis: Total computed in the action using floating-point arithmetic.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 134
        line_end: 146
