  - record_key: CHK-REQ-0003
    kind: integration
    capability_key: order-notifications
    requirement: >
      The system SHALL, on order submission, send the purchase order as an XML message asynchronously to the order processing centre, empty the cart, and return the shopper's e-mail and the order id for the confirmation page.
    plain_text: >
      Placing an order sends it to back-office processing in the background and then clears the cart; the shopper is shown a confirmation.
    technical_note: >
      AsyncSenderLocal.sendAMessage(purchaseOrder.toXML()). The user guide says the order goes to the OPC asynchronously. Approval is performed downstream.
    interface: true
    confidence: high
    confidence_basis: >
      Code plus the user guide section 2.5 agree on the asynchronous send.
    risk_class: financial
    basis: Async JMS-style send followed by cart.empty().
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 147
        line_end: 168
