    requirement: >
      The system SHALL let a shopper add an item to the cart, delete an item, and update the quantity of several items in one request.
    plain_text: >
      Shoppers can add items to the cart, remove them, and change quantities.
    technical_note: >
      CartEJBAction switches on CartEvent.ADD_ITEM / DELETE_ITEM / UPDATE_ITEMS and delegates to the ShoppingCart bean obtained via the client facade; cart.do maps to CartHTMLAction and cart.screen.
    interface: false
    confidence: medium
    confidence_basis: >
      One clear place (the action); quantity limits (zero, negative) are enforced in the cart bean in another module that I did not read.
    risk_class: operational
    basis: Cart operations dispatched by action type.
