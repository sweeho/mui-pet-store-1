          sender.sendAMessage(purchaseOrder.toXML());
          cart.empty();
          return new OrderEventResponse(billTo.getEmail(), orderIdString);
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: "2.5 Placing an order"
        excerpt: |
          The Storefront sends the order to the OPC asynchronously.
    stack_metadata:
      ejb.bean: AsyncSenderLocal
      jms.queue: OPC purchase order queue (JNDI ASYNCSENDER_LOCAL_EJB_HOME)
