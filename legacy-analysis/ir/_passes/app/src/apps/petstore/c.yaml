records:
  - record_key: SHOP-REQ-0001
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      GIVEN a shopper submits an order WHEN the shopping cart holds no items THEN the system SHALL refuse the order and show the empty-cart order error screen.
    plain_text: >
      An order cannot be placed with an empty cart; the shopper sees a message instead.
    technical_note: >
      OrderEJBAction throws ShoppingCartEmptyOrderException when cart.getItems() is empty; mappings.xml routes that exception to cart_empty_order_error.screen. cart.jsp separately shows "Your Shopping Cart is Empty."
    interface: false
    confidence: high
    confidence_basis: >
      Enforced in the order action and in the declarative exception mapping, and the cart page displays the empty state; the documents do not mention it.
    risk_class: operational
    basis: Explicit exception thrown on empty cart and mapped to a dedicated screen.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 130
        line_end: 132
        excerpt: |
          if (items.size() == 0) {
            throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
          }
      - path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 110
        line_end: 110
        excerpt: |
              <exception-mapping exception-class="com.sun.j2ee.blueprints.petstore.controller.exceptions.ShoppingCartEmptyOrderException" screen="cart_empty_order_error.screen"/>
    stack_metadata:
      framework: WAF front controller
      ejb.bean: ShoppingControllerEJB / OrderEJBAction
