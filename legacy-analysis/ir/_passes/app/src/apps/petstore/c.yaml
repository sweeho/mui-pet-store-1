findings:
  - kind: ambiguity
    path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
    description: >
      Event mappings reference SignOffEvent/SignOffEJBAction and the exception mapping GeneralFailureException, whose classes are not under this module; and the order approval threshold lives in the OPC, not here. A human should confirm these are covered by the other modules.
