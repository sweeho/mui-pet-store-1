  - record_key: CHK-REQ-0001
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      GIVEN a shopper submits an order WHEN the shopping cart contains no items THEN the system SHALL refuse the order, show the empty-cart error screen, and not send an order.
    confidence: high
    confidence_basis: >
      Enforced in the order action (explicit size check) and mapped to a dedicated error screen in mappings.xml; two places.
    risk_class: operational
    basis: The order action throws an empty-cart exception before building the order; the URL mapping routes that exception to an error screen.
    plain_text: A customer cannot place an order when their cart is empty; they see an explanatory error page.
    technical_note: OrderEJBAction.perform checks cart.getItems().size()==0 and throws ShoppingCartEmptyOrderException; mappings.xml maps it to cart_empty_order_error.screen.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 128
        line_end: 132
        excerpt: |
          Collection items = cart.getItems();
          // if the cart is empty throw an exception saying so
          if (items.size() == 0) {
            throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
          }
      - path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 106
        line_end: 106
        excerpt: |
          <exception-mapping exception-class="com.sun.j2ee.blueprints.petstore.controller.exceptions.ShoppingCartEmptyOrderException" screen="cart_empty_order_error.screen"/>
    stack_metadata:
      framework: Sun WAF
      ejb.bean: ShoppingControllerEJB
