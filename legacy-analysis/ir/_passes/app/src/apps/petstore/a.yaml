suspected_defects:
  - capability_key: checkout-and-payment
    record_keys: [CHK-REQ-0003]
    severity: high
    category: data-corruption
    title: Order always carries a hard-coded credit card
    description: >
      The order web action ignores any card entered by the user and always attaches card "1234-2334", "Duke Express", expiry "10/2001" (an expired date); a source comment says the data should be part of the form.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
        line_start: 79
        line_end: 83
  - capability_key: order-notifications
    record_keys: [NOTIF-REQ-0001]
    severity: high
    category: error-swallowed
    title: Order send failures are swallowed and the cart is still emptied
    description: >
      Lookup, XML and create failures when sending the order message are printed or ignored; the cart is emptied and a success response with order id is returned even though no message was sent. Also a failed unique-id lookup leaves a null generator that then raises a null pointer.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 147
        line_end: 168
  - capability_key: checkout-and-payment
    record_keys: [CHK-REQ-0004]
    severity: medium
    category: other
    title: Credit card required-field checks test the wrong variable and are never raised
    description: >
      Card type and expiry month/year checks all test the card number; and the missing-field list is built but never thrown or reported in the card and profile extraction, so empty card or profile data is accepted.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
        line_start: 140
        line_end: 175
  - capability_key: checkout-and-payment
    record_keys: [CHK-REQ-0002]
    severity: medium
    category: other
    title: Failed address validation returns null contact and may fail downstream
    description: >
      When fields are missing the action sets an error in the request and returns null for the contact; the order event is still constructed with that null contact. How the screen handles this was not established.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
        line_start: 80
        line_end: 83
  - capability_key: checkout-and-payment
    record_keys: [CHK-REQ-0003]
    severity: low
    category: inconsistent-rounding
    title: Order total computed with binary floating point
    description: >
      Unit costs and totals are summed as float values with no rounding step.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 123
        line_end: 146
findings:
  - kind: ambiguity
    path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/web.xml
    description: >
      Session timeout is 15 minutes (line 162); no requirement was written for it. A human should decide if it is a business rule. Region approval limits (US 500, JP 50000) are not in this module; the user guide states only the 500 threshold.
