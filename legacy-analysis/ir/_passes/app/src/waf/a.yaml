suspected_defects:
  - capability_key: internationalisation
    record_keys: [INTL-BR-0002]
    severity: low
    category: unreachable-branch
    title: Variant part of locale parsing can never be applied
    description: >
      variantIndex is initialised to -1 and never reassigned (countryIndex is reassigned instead), so a three-part locale such as ja_JP_variant is parsed with a country of null or a truncated value and the variant is never used.
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 182
        line_end: 190
  - capability_key: internationalisation
    record_keys: [INTL-REQ-0001]
    severity: medium
    category: other
    title: Locale-change event class in mapping does not match the class that exists
    description: >
      mappings.xml names com.sun.j2ee.blueprints.waf.event.events.ChangeLocaleEvent, but the class lives in the event.impl package. The change may not reach the controller component if the mapping is used as written.
    traces:
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/mappings.xml
        line_start: 44
        line_end: 46
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/event/impl/ChangeLocaleEvent.java
        line_start: 1
        line_end: 10
  - capability_key: internationalisation
    record_keys: [INTL-BR-0003]
    severity: medium
    category: contradicts-document
    title: Language does not follow the browser setting
    description: >
      The user guide says the language follows the browser setting; this module initialises the session locale from a fixed default (en_US) and never reads the browser's Accept-Language.
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 110
        line_end: 113
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: p1
  - capability_key: internationalisation
    record_keys: [INTL-BR-0004]
    severity: low
    category: other
    title: Only en_US screens are loaded and the sample page offers unsupported locales
    description: >
      The locales init-param lists only en_US, yet the sample page offers de_DE, ja_JP and zh_CN; the user guide promises English, Japanese and Chinese. Selecting those here silently falls back to en_US.
    traces:
