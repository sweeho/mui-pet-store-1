  - record_key: INTL-REQ-0005
    kind: requirement
    capability_key: internationalisation
    requirement: >
      The system SHALL format currency amounts and numbers for a given locale with a caller-specified number of decimal places, optionally using a caller-specified pattern.
    confidence: medium
    confidence_basis: >
      One clear place (I18nUtil); no caller of these methods was found inside this module, so whether they run in the live application is not established.
    risk_class: financial
    basis: >
      Four formatting helpers use locale currency/number instances and set min and max fraction digits to the precision. The runbook states order value is in the currency of the locale.
    plain_text: >
      Prices and numbers are shown in the style and currency of the shopper's language, with a fixed number of decimals.
    technical_note: >
      I18nUtil.formatCurrency/formatNumber (two overloads each, double amount). Uses double arithmetic and default rounding of DecimalFormat (half-even). Pattern overloads additionally force the decimal separator to be shown.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 100
        line_end: 105
        excerpt: |
          public static String formatCurrency(double amount, int precision, Locale locale){
              NumberFormat nf = NumberFormat.getCurrencyInstance(locale);
              nf.setMinimumFractionDigits(precision);
              nf.setMaximumFractionDigits(precision);
              return nf.format(amount);
          }
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        kind: document
        anchor: p1
        excerpt: |
          The order value is in the currency of the locale.
    stack_metadata:
      framework: Sun J2EE Blueprints WAF

