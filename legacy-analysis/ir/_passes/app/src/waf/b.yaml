suspected_defects:
  - capability_key: internationalisation
    record_keys: [INTL-RULE-0002]
    severity: low
    category: unreachable-branch
    title: Locale variant parsing never applies a variant
    description: >
      variantIndex is initialised to -1 and never reassigned (countryIndex is reassigned instead), so the variant branch is dead and codes with three parts are parsed with a country containing the underscore remainder or ignored.
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 182
        line_end: 190
        excerpt: |
          int variantIndex = -1;
          if (countryIndex != -1) countryIndex = localeString.indexOf('_', countryIndex +1);
  - capability_key: internationalisation
    record_keys: [INTL-RULE-0004]
    severity: medium
    category: contradicts-document
    title: Only en_US screens are configured though Japanese and Chinese are documented
    description: >
      web.xml lists only en_US in the "locales" parameter and only screendefinitions_en_US.xml exists in this module, while the guides describe English, Japanese and Chinese localisations. The change-locale demo page also offers German, which has no screens.
    traces:
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/web.xml
        line_start: 69
        line_end: 71
        excerpt: |
          <param-name>locales</param-name>
          <param-value>en_US</param-value>
      - path: legacy-analysis/sources/pdf/petstore-admin-guide/extracted.md
        anchor: p1
        excerpt: |
          comes with the English (en) and Japanese (ja) localizations

findings:
  - kind: ambiguity
    path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/ejb/StateMachine.java
    description: >
      The rest of the module is generic framework plumbing (request dispatch, screen templating, form tags, EJB state machine) with no business rules. StateMachine swallows action-loading errors by printing to stderr and returning a null response. Whether that matters depends on the application modules that use it; a human should decide whether framework behaviour needs a requirement.
