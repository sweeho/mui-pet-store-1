records:
  - record_key: INTL-REQ-0001
    kind: requirement
    capability_key: internationalisation
    requirement: >
      The system SHALL let a user switch the display language by submitting a locale code, store the chosen locale for the rest of the user's session, and raise a change-locale event for the back end.
    confidence: medium
    confidence_basis: >
      One clear place (the change-locale action plus its URL mapping). The sample page lists the options but is a framework demo, so no second enforcement point was seen.
    risk_class: presentational
    basis: >
      The action reads the "locale" parameter, converts it, saves it to the session and returns a ChangeLocaleEvent; the URL mapping routes changelocale.do to a success screen.
    plain_text: >
      A shopper can choose a language, and the store then shows its pages in that language for the rest of the visit.
    technical_note: >
      ChangeLocaleHTMLAction.perform stores the Locale in the session attribute com.sun.j2ee.blueprints.waf.LOCALE. mappings.xml maps changelocale.do to locale_change_success.screen.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/action/actions/ChangeLocaleHTMLAction.java
        line_start: 73
        line_end: 83
        excerpt: |
          String localeString = request.getParameter("locale");
          Locale locale = I18nUtil.getLocaleFromString(localeString);
          ...
          session.setAttribute(LOCALE,locale);
          return new ChangeLocaleEvent(locale);
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/mappings.xml
        line_start: 52
        line_end: 54
        excerpt: |
          <url-mapping url="changelocale.do" screen="locale_change_success.screen" >
    stack_metadata:
      framework: WAF (Sun Java Pet Store web application framework)
      struts.action: ChangeLocaleHTMLAction

  - record_key: INTL-RULE-0002
    kind: business-rule
    capability_key: internationalisation
    requirement: >
      GIVEN a locale code that cannot be parsed, WHEN a user requests a language change, THEN the system SHALL refuse the change and report an error naming the unusable value, leaving the session locale unchanged.
    confidence: medium
    confidence_basis: >
      Read in the action and in the parser; the parser has odd logic (see defect) so the exact set of accepted codes is inferred.
    risk_class: presentational
    basis: >
      The parser returns null when the code is null or has no underscore; the action throws HTMLActionException when the result is null.
    plain_text: >
      If the language choice is not recognised, the language stays as it was and an error is shown.
    technical_note: >
      I18nUtil.getLocaleFromString accepts "default" (JVM default locale) or language_COUNTRY. A variant part is never applied.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/action/actions/ChangeLocaleHTMLAction.java
        line_start: 78
        line_end: 83
        excerpt: |
          if (locale != null) {
              session.setAttribute(LOCALE,locale);
          ...
              throw new HTMLActionException("ChangeLocaleAction: Unable to change language to " + localeString);
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 168
        line_end: 172
        excerpt: |
          public static Locale getLocaleFromString(String localeString) {
              if (localeString == null) return null;
              if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
              int languageIndex = localeString.indexOf('_');
              if (languageIndex  == -1) return null;
    stack_metadata:
      framework: WAF

  - record_key: INTL-REQ-0003
    kind: requirement
    capability_key: internationalisation
    requirement: >
      The system SHALL give every new session a default locale (configured as en_US) when the session has none.
    confidence: high
    confidence_basis: >
      Enforced in the main controller and configured in web.xml (two places).
    risk_class: presentational
    basis: >
      MainServlet sets the session locale to the configured default if absent; web.xml supplies default_locale en_US.
    plain_text: >
      A visitor who has not chosen a language sees the store in US English.
    technical_note: >
      MainServlet.doProcess; init-param default_locale in web.xml for MainServlet and TemplateServlet.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 110
        line_end: 113
        excerpt: |
          // set the locale of the user to default if not set
          if (request.getSession().getAttribute(WebKeys.LOCALE) == null) {
              request.getSession().setAttribute(WebKeys.LOCALE, defaultLocale);
          }
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/web.xml
        line_start: 58
        line_end: 59
        excerpt: |
          <param-name>default_locale</param-name>
          <param-value>en_US</param-value>
    stack_metadata:
      framework: WAF
      session.scope: session

