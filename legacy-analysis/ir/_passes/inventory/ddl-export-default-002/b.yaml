findings: []
suspected_defects:
  - capability_key: order-fulfilment
    record_keys: [FUL-ENT-0001]
    severity: medium
    category: inconsistent-rounding
    title: Order line unit price type differs between database variants
    description: >
      unit_price is a binary double in the Cloudscape schema and number(12,2) in the Oracle schema, so amounts can carry floating-point error on one and be fixed at two decimals on the other.
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: po_line_item
        line_start: 161
        line_end: 171
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: po_line_item
        line_start: 161
        line_end: 171
