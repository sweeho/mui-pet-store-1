records:
  - record_key: CAT-ENT-0001
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL identify each product by a unique 10-character product id and SHALL require every product to belong to an existing category.
    confidence: high
    confidence_basis: >
      Primary key and not-null foreign key to category declared identically in both the Cloudscape and Oracle DDL.
    risk_class: operational
    basis: >
      product table: productid PK, catid NOT NULL FK to category.
    plain_text: >
      Every product has its own code and must belong to a category that exists.
    technical_note: >
      Table product, pk_product, fk_product_1. Cloudscape uses char(10), Oracle varchar2(10).
    interface: false
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: product
        line_start: 30
        line_end: 34
        excerpt: |
          CREATE TABLE product (
            productid char(10) not null,
            catid char(10) not null,
            constraint pk_product primary key (productid),
            constraint fk_product_1 foreign key (catid) references category (catid));
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: product
        line_start: 30
        line_end: 34
        excerpt: |
          CREATE TABLE product (
            productid varchar2(10) not null,
            catid varchar2(10) not null,
            constraint pk_product primary key (productid),
            constraint fk_product_1 foreign key (catid) references category (catid));
    stack_metadata:
      db.object: product
      db.kind: table
      db.writes: product
  - record_key: CAT-ENT-0002
    kind: entity
    capability_key: internationalisation
    requirement: >
      The system SHALL store product name, image and description per product and locale, SHALL require a name for each (product, locale) pair, and SHALL reject a product detail row whose product does not exist.
    confidence: high
    confidence_basis: >
      Composite PK (productid, locale), NOT NULL name, FK to product in both DDL variants.
    risk_class: presentational
    basis: >
      product_details: PK(productid,locale), name not null, image/descn optional.
    plain_text: >
      Product names and descriptions are kept per language; each language version needs a name, while image and description are optional.
    technical_note: >
      Table product_details, pk_product_details, fk_product_details_1.
    interface: false
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: product_details
        line_start: 38
        line_end: 45
        excerpt: |
          CREATE TABLE product_details (
            productid char(10) not null,
            locale char(10) not null,
            name varchar(80) not null,
            image varchar(255),
            descn varchar(255),
            constraint pk_product_details primary key (productid, locale),
            constraint fk_product_details_1 foreign key (productid) references product (productid));
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: product_details
        line_start: 38
        line_end: 45
        excerpt: |
          CREATE TABLE product_details (
            productid varchar2(10) not null,
            locale varchar2(10) not null,
            name varchar2(80) not null,
            image varchar2(255),
            descn varchar2(255),
            constraint pk_product_details primary key (productid, locale),
            constraint fk_product_details_1 foreign key (productid) references product (productid));
    stack_metadata:
      db.object: product_details
      db.kind: table
  - record_key: CAT-ENT-0003
    kind: entity
    capability_key: internationalisation
    requirement: >
      The system SHALL store item list price, unit cost, image and description per item and locale, SHALL require all of these, SHALL allow up to five optional attributes, and SHALL reject a detail row whose item does not exist.
    confidence: high
    confidence_basis: >
      NOT NULL columns, composite PK (itemid, locale) and FK to item in both DDL variants.
    risk_class: financial
    basis: >
      item_details: listprice and unitcost decimal(10,2) not null; image, descn not null; attr1-5 nullable.
    plain_text: >
      Each item has a price, cost, picture and description for each language, and up to five extra descriptive attributes.
    technical_note: >
      Table item_details, pk_item_details, fk_item_details_1. Prices decimal(10,2) in both.
    interface: false
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: item_details
        line_start: 57
        line_end: 70
        excerpt: |
          CREATE TABLE item_details (
            itemid char(10) not null,
            listprice decimal(10,2) not null,
            unitcost decimal(10,2) not null,
            locale char(10) not null,
            image varchar(255) not null,
            descn varchar(255) not null,
            attr1 varchar(80),
            attr2 varchar(80),
            attr3 varchar(80),
            attr4 varchar(80),
            attr5 varchar(80),
            constraint pk_item_details primary key (itemid, locale),
            constraint fk_item_details_1 foreign key (itemid) references item (itemid));
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: item_details
        line_start: 57
        line_end: 70
        excerpt: |
          CREATE TABLE item_details (
            itemid varchar2(10) not null,
            listprice decimal(10,2) not null,
            unitcost decimal(10,2) not null,
            locale varchar2(10) not null,
            image varchar2(255) not null,
            descn varchar2(255) not null,
            attr1 varchar2(80),
            attr2 varchar2(80),
            attr3 varchar2(80),
            attr4 varchar2(80),
            attr5 varchar2(80),
            constraint pk_item_details primary key (itemid, locale),
            constraint fk_item_details_1 foreign key (itemid) references item (itemid));
    stack_metadata:
      db.object: item_details
      db.kind: table
  - record_key: FUL-ENT-0001
    kind: entity
    capability_key: order-fulfilment
    requirement: >
      The system SHALL record each purchase order line with category, product, item, quantity, unit price and quantity shipped, all mandatory, identified by purchase order id and line number, and SHALL reject a line whose purchase order does not exist.
    confidence: high
    confidence_basis: >
      Not-null columns, composite PK and FK to purchase_order in both variants. Category/product/item ids carry no FK, so referential integrity there is not enforced.
    risk_class: financial
    basis: >
      po_line_item: PK(po_id,line_number); FK to purchase_order only; quantity_shipped not null.
    plain_text: >
      Each order line records what was ordered, at what price, and how many units have shipped.
    technical_note: >
      Table po_line_item. unit_price is double in Cloudscape and number(12,2) in Oracle, so monetary precision differs between variants.
    interface: false
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: po_line_item
        line_start: 161
        line_end: 171
        excerpt: |
          CREATE TABLE po_line_item (
            po_id varchar(40) not null,
            line_number varchar(10) not null,
            category_id char(10) not null,
            product_id char(10) not null,
            item_id char(10) not null,
            quantity integer not null,
            unit_price double not null,
            quantity_shipped integer not null,
            constraint pk_po_line_item primary key (po_id, line_number),
            constraint fk_po_line_item_1 foreign key (po_id) references purchase_order (po_id));
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: po_line_item
        line_start: 161
        line_end: 171
        excerpt: |
          CREATE TABLE po_line_item (
            po_id varchar2(40) not null,
            line_number varchar2(10) not null,
            category_id varchar2(10) not null,
            product_id varchar2(10) not null,
            item_id varchar2(10) not null,
            quantity integer not null,
            unit_price number(12,2) not null,
            quantity_shipped integer not null,
            constraint pk_po_line_item primary key (po_id, line_number),
            constraint fk_po_line_item_1 foreign key (po_id) references purchase_order (po_id));
    stack_metadata:
      db.object: po_line_item
      db.kind: table
  - record_key: FUL-ENT-0002
    kind: entity
    capability_key: order-approval
    requirement: >
      The system SHALL track exactly one status value of up to 20 characters per order id in the order manager, and SHALL require both order id and status.
    confidence: medium
    confidence_basis: >
      Table definition only; no CHECK on allowed status values, so the lifecycle itself is not visible here.
    risk_class: operational
    basis: >
      order_manager: order_id PK, status not null varchar(20).
    plain_text: >
      Each order has one current status that is always present.
    technical_note: >
      Table order_manager, pk_order_manager. Status values are not constrained in DDL; set by application code.
    interface: false
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: order_manager
        line_start: 175
        line_end: 178
        excerpt: |
          CREATE TABLE order_manager (
            order_id varchar(40) not null,
            status varchar(20) not null,
            constraint pk_order_manager primary key (order_id));
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: order_manager
        line_start: 175
        line_end: 178
        excerpt: |
          CREATE TABLE order_manager (
            order_id varchar2(40) not null,
            status varchar2(20) not null,
            constraint pk_order_manager primary key (order_id));
    stack_metadata:
      db.object: order_manager
      db.kind: table
