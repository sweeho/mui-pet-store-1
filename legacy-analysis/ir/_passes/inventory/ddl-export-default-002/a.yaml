records:
  - record_key: CATALOG-ENT-0001
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL store each product with a unique product identifier (max 10 chars) and a mandatory category that must exist in the category table.
    confidence: high
    confidence_basis: >
      Constraints enforced by the database in two schema scripts (Cloudscape and Oracle), identical in both.
    risk_class: operational
    basis: >
      PK on productid, NOT NULL catid, FK fk_product_1 to category.
    plain_text: >
      Every product has its own code and belongs to exactly one existing category.
    technical_note: >
      Table product; char(10) in Cloudscape, varchar2(10) in Oracle.
    interface: false
    traces:
      - kind: db_object
        path: legacy-source/db/schema/petstore_cloudscape.sql
        anchor: product
        line_start: 30
        line_end: 34
        excerpt: |
          CREATE TABLE product (
            productid char(10) not null,
            catid char(10) not null,
            constraint pk_product primary key (productid),
            constraint fk_product_1 foreign key (catid) references category (catid));
      - kind: db_object
        path: legacy-source/db/schema/petstore_oracle.sql
        anchor: product
        line_start: 30
        line_end: 34
        excerpt: |
          CREATE TABLE product (
            productid varchar2(10) not null,
            catid varchar2(10) not null,
            constraint pk_product primary key (productid),
            constraint fk_product_1 foreign key (catid) references category (catid));
    stack_metadata:
      db.object: product
      db.kind: table
  - record_key: CATALOG-ENT-0002
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL store per-locale product details keyed by (productid, locale), each with a mandatory name up to 80 chars, optional image and description up to 255 chars, referencing an existing product.
    confidence: high
    confidence_basis: >
      NOT NULL, composite PK and FK constraints, same in two scripts.
    risk_class: presentational
    basis: >
      Composite PK (productid, locale), name NOT NULL, FK to product.
    plain_text: >
      A product can have a separate name, picture and description for each language; the name is required, the picture and description are optional.
    technical_note: >
      Table product_details; supports localisation of catalog text.
    interface: false
    traces:
      - kind: db_object
        path: legacy-source/db/schema/petstore_cloudscape.sql
        anchor: product_details
        line_start: 38
        line_end: 45
        excerpt: |
          CREATE TABLE product_details (
            productid char(10) not null,
            locale char(10) not null,
            name varchar(80) not null,
            image varchar(255),
            descn varchar(255),
            constraint pk_product_details primary key (productid, locale),
            constraint fk_product_details_1 foreign key (productid) references product (productid));
      - kind: db_object
        path: legacy-source/db/schema/petstore_oracle.sql
        anchor: product_details
        line_start: 38
        line_end: 45
        excerpt: |
          CREATE TABLE product_details (
            productid varchar2(10) not null,
            locale varchar2(10) not null,
            name varchar2(80) not null,
            image varchar2(255),
            descn varchar2(255),
            constraint pk_product_details primary key (productid, locale),
            constraint fk_product_details_1 foreign key (productid) references product (productid));
    stack_metadata:
      db.object: product_details
      db.kind: table
  - record_key: CATALOG-ENT-0003
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL store per-locale item details keyed by (itemid, locale) with mandatory list price and unit cost (decimal 10,2), image and description, up to five optional attributes of 80 chars, referencing an existing item.
    confidence: high
    confidence_basis: >
      NOT NULL, precision and FK constraints, same in two scripts.
    risk_class: financial
    basis: >
      listprice/unitcost decimal(10,2) NOT NULL; composite PK; FK to item.
    plain_text: >
      Each item has a price, cost, picture and description per language, plus up to five optional attributes such as colour or size.
    technical_note: >
      Table item_details. Prices are held per locale, so list price may differ by locale.
    interface: false
    traces:
      - kind: db_object
        path: legacy-source/db/schema/petstore_cloudscape.sql
        anchor: item_details
        line_start: 57
        line_end: 70
        excerpt: |
          CREATE TABLE item_details (
            itemid char(10) not null,
            listprice decimal(10,2) not null,
            unitcost decimal(10,2) not null,
            locale char(10) not null,
            image varchar(255) not null,
            descn varchar(255) not null,
            attr1 varchar(80), attr2 varchar(80), attr3 varchar(80), attr4 varchar(80), attr5 varchar(80),
            constraint pk_item_details primary key (itemid, locale),
            constraint fk_item_details_1 foreign key (itemid) references item (itemid));
      - kind: db_object
        path: legacy-source/db/schema/petstore_oracle.sql
        anchor: item_details
        line_start: 57
        line_end: 70
        excerpt: |
          CREATE TABLE item_details (
            itemid varchar2(10) not null,
            listprice decimal(10,2) not null,
            unitcost decimal(10,2) not null,
            locale varchar2(10) not null,
            image varchar2(255) not null,
            descn varchar2(255) not null,
            attr1..attr5 varchar2(80),
            constraint pk_item_details primary key (itemid, locale),
            constraint fk_item_details_1 foreign key (itemid) references item (itemid));
    stack_metadata:
      db.object: item_details
      db.kind: table
  - record_key: FULFIL-ENT-0001
    kind: entity
    capability_key: order-fulfilment
    requirement: >
      The system SHALL store each purchase order line with a mandatory line number unique within the purchase order, category, product, item, quantity, unit price and quantity shipped, referencing an existing purchase order.
    confidence: high
    confidence_basis: >
      NOT NULL, composite PK and FK constraints in two scripts; the unit price type differs between them.
    risk_class: financial
    basis: >
      PK (po_id, line_number); all columns NOT NULL; FK to purchase_order.
    plain_text: >
      Each supplier order line records what was ordered, at what price, and how many units have shipped.
    technical_note: >
      Table po_line_item. unit_price is double in Cloudscape and number(12,2) in Oracle. category_id/product_id/item_id have no FK.
    interface: false
    traces:
      - kind: db_object
        path: legacy-source/db/schema/petstore_cloudscape.sql
        anchor: po_line_item
        line_start: 161
        line_end: 171
        excerpt: |
          CREATE TABLE po_line_item (
            po_id varchar(40) not null,
            line_number varchar(10) not null,
            category_id char(10) not null,
            product_id char(10) not null,
            item_id char(10) not null,
            quantity integer not null,
            unit_price double not null,
            quantity_shipped integer not null,
            constraint pk_po_line_item primary key (po_id, line_number),
            constraint fk_po_line_item_1 foreign key (po_id) references purchase_order (po_id));
      - kind: db_object
        path: legacy-source/db/schema/petstore_oracle.sql
        anchor: po_line_item
        line_start: 161
        line_end: 171
        excerpt: |
          CREATE TABLE po_line_item (
            po_id varchar2(40) not null,
            line_number varchar2(10) not null,
            category_id varchar2(10) not null,
            product_id varchar2(10) not null,
            item_id varchar2(10) not null,
            quantity integer not null,
            unit_price number(12,2) not null,
            quantity_shipped integer not null,
            constraint pk_po_line_item primary key (po_id, line_number),
            constraint fk_po_line_item_1 foreign key (po_id) references purchase_order (po_id));
    stack_metadata:
      db.object: po_line_item
      db.kind: table
  - record_key: FULFIL-ENT-0002
    kind: entity
    capability_key: order-fulfilment
    requirement: >
      The system SHALL store exactly one status (max 20 chars, mandatory) per order identifier in the order manager.
    confidence: high
    confidence_basis: >
      PK and NOT NULL constraints in two scripts. Permitted status values are not constrained here.
    risk_class: operational
    basis: >
      PK order_id, status NOT NULL, no CHECK on values.
    plain_text: >
      Each order has one current status that is always filled in.
    technical_note: >
      Table order_manager; no CHECK, so the status lifecycle is enforced in application code, not visible here.
    interface: false
    traces:
      - kind: db_object
        path: legacy-source/db/schema/petstore_cloudscape.sql
        anchor: order_manager
        line_start: 175
        line_end: 178
        excerpt: |
          CREATE TABLE order_manager (
            order_id varchar(40) not null,
            status varchar(20) not null,
            constraint pk_order_manager primary key (order_id));
      - kind: db_object
        path: legacy-source/db/schema/petstore_oracle.sql
        anchor: order_manager
        line_start: 175
        line_end: 178
        excerpt: |
          CREATE TABLE order_manager (
            order_id varchar2(40) not null,
            status varchar2(20) not null,
            constraint pk_order_manager primary key (order_id));
    stack_metadata:
      db.object: order_manager
      db.kind: table
  - record_key: CATALOG-ENT-0004
