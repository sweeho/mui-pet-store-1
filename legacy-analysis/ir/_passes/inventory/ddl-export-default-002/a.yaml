findings: []
suspected_defects:
  - capability_key: order-fulfilment
    record_keys: [FULFIL-ENT-0001]
    severity: medium
    category: inconsistent-rounding
    title: Purchase order line unit price type differs between databases
    description: >
      unit_price is a binary floating-point double in the Cloudscape script but a fixed number(12,2) in the Oracle script, so amounts may carry rounding error on one database and not the other.
    traces:
      - kind: db_object
        path: legacy-source/db/schema/petstore_cloudscape.sql
        anchor: po_line_item
        line_start: 161
        line_end: 171
        excerpt: |
          unit_price double not null,
      - kind: db_object
        path: legacy-source/db/schema/petstore_oracle.sql
        anchor: po_line_item
        line_start: 161
        line_end: 171
        excerpt: |
          unit_price number(12,2) not null,
