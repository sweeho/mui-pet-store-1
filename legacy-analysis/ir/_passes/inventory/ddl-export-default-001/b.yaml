    plain_text: "Each product category has a short code and a name, picture and description in each supported language; the name is always required."
    technical_note: "category(catid PK); category_details PK(catid,locale), FK catid->category, name/locale NOT NULL, image/descn nullable. Cloudscape uses char(10), Oracle varchar2(10)."
