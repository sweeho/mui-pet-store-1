records:
  - record_key: CAT-ENT-0001
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL hold the catalog as category, product and item, where each product belongs to exactly one category and each item belongs to exactly one product, with the name, image and description of each held per locale.
    confidence: high
    confidence_basis: >
      Primary and foreign keys declared in both the Oracle and Cloudscape DDL, plus header comment naming PopulateSQL.xml as the origin.
    risk_class: operational
    basis: Tables category, category_details, product, product_details, item with PK/FK constraints; details tables keyed by (id, locale).
    plain_text: Pets are organised as categories, products within a category, and sellable items within a product; names and descriptions exist once per language.
    technical_note: Tables CATEGORY, CATEGORY_DETAILS(catid, locale), PRODUCT(catid FK), PRODUCT_DETAILS(productid, locale), ITEM(productid FK). Populated from PopulateSQL.xml.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 13
        line_end: 53
        excerpt: |
          CREATE TABLE category (
            catid varchar2(10) not null,
            constraint pk_category primary key (catid));
          ...
          CREATE TABLE item (
            itemid varchar2(10) not null,
            productid varchar2(10) not null,
            constraint pk_item primary key (itemid),
            constraint fk_item_1 foreign key (productid) references product (productid));
      - path: legacy-source/db/schema/petstore_cloudscape.sql
        line_start: 13
        line_end: 53
        excerpt: "same structure with char/varchar types"
    stack_metadata:
      db.object: category, category_details, product, product_details, item
  - record_key: CAT-ENT-0002
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL store per item and locale a list price and a unit cost (each up to 10 digits with 2 decimals), an image and a description as mandatory values, and up to five optional attributes.
    confidence: high
    confidence_basis: DDL in two dialect files agrees; NOT NULL constraints explicit.
    risk_class: financial
    basis: item_details table definition.
    plain_text: Each item has, for every language, a shelf price, a supplier cost, a picture, a description and up to five extra descriptive attributes.
    technical_note: ITEM_DETAILS PK (itemid, locale); LISTPRICE is shelf price, UNITCOST supplier cost; attr1..attr5 varchar(80) nullable.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 55
        line_end: 70
        excerpt: |
          CREATE TABLE item_details (
            itemid varchar2(10) not null,
            listprice decimal(10,2) not null,
            unitcost decimal(10,2) not null,
            locale varchar2(10) not null,
    stack_metadata:
      db.object: item_details
  - record_key: CAT-BR-0003
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      GIVEN an item price below its unit cost, WHEN catalog data is stored, THEN the system SHALL accept it, because no price check exists on item details.
    confidence: medium
    confidence_basis: One explicit comment stating the absence of a check; sample data (EST-26 ja_JP) cited but not inspected here.
    risk_class: financial
    basis: Comment states no price check exists and sample data has an item priced below cost; the catalog check batch reports it instead.
    plain_text: The system does not prevent an item from being priced below its cost; a separate check reports such items.
    technical_note: No CHECK on ITEM_DETAILS; detection only in batch catalog check.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 230
        line_end: 231
        excerpt: |
          -- Business checks the schema cannot express as keys. No price check on ITEM_DETAILS:
          -- the shipped sample data has an item priced below cost (EST-26, ja_JP), see batch/ps_catalog_check.sh.
    stack_metadata:
      db.object: item_details
  - record_key: ACC-ENT-0001
    kind: entity
    capability_key: customer-accounts
    requirement: >
      The system SHALL store sign-on credentials with a unique user name and a mandatory password of up to 50 characters, and SHALL store the password as plain text.
    confidence: high
    confidence_basis: DDL column plus explicit comment "PASSWORD is plain text", in both dialect files.
    risk_class: regulated
    basis: signon_user table and its comment.
    plain_text: Each user name is unique and has a password; passwords are kept readable, not protected.
    technical_note: SIGNON_USER(username PK, password varchar 50). No hashing.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 72
        line_end: 77
        excerpt: |
          -- SIGNON_USER: Sign-on credentials. One row per user name. PASSWORD is plain text.
          CREATE TABLE signon_user (
            username varchar2(50) not null,
            password varchar2(50) not null,
    stack_metadata:
      db.object: signon_user
  - record_key: ACC-ENT-0002
    kind: entity
    capability_key: customer-accounts
    requirement: >
      The system SHALL represent a customer as a user (equal to a sign-on user name) linked to exactly one account and one profile; an account links to one contact record and one payment card and has a mandatory status; a contact has mandatory family name, given name, telephone, e-mail and one address with mandatory street, city, state, zip code and country.
    confidence: high
    confidence_basis: Foreign keys and NOT NULL columns declared in both DDL files.
    risk_class: regulated
    basis: customer, account, profile, contact_info, address tables.
    plain_text: A customer has a sign-on, an account (status, contact details, payment card) and a profile of preferences; contact details require full name, phone, e-mail and a complete address.
    technical_note: CUSTOMER.user_id FK signon_user.username; ACCOUNT.contact_id, card_id FKs; PROFILE has preferred_language (mandatory), favorite_category, my_list_preference and banner_preference as 0/1 flags (number(1) in Oracle, smallint in Cloudscape). Address and contact_info shared with orders and supplier orders. Account status values are not constrained by a CHECK.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 79
        line_end: 142
        excerpt: |
          CREATE TABLE customer (
            user_id varchar2(50) not null,
            account_id varchar2(40) not null,
            profile_id varchar2(40) not null,
            constraint pk_customer primary key (user_id),
            constraint fk_customer_1 foreign key (user_id) references signon_user (username),
    stack_metadata:
      db.object: customer, account, profile, contact_info, address
  - record_key: CHK-ENT-0001
    kind: entity
    capability_key: checkout-and-payment
    requirement: >
      The system SHALL store a payment card with a mandatory card number (up to 40 characters), card type and expiry date held as text of up to 10 characters (for example 04/04), and SHALL store the card number unencrypted.
    confidence: high
    confidence_basis: DDL plus comment stating clear storage, in both dialect files.
    risk_class: regulated
    basis: credit_card table and comment.
    plain_text: A payment card record holds number, type and expiry; the number is kept readable.
    technical_note: CREDIT_CARD(card_id PK, card_number, card_type, expiry_date varchar 10). No format or expiry check in schema.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 103
        line_end: 110
        excerpt: |
          -- CREDIT_CARD: Payment card. CARDNUMBER is stored in clear. EXPIRYDATE is text such as 04/04.
          CREATE TABLE credit_card (
            card_id varchar2(40) not null,
            card_number varchar2(40) not null,
    stack_metadata:
      db.object: credit_card
  - record_key: CHK-ENT-0002
    kind: entity
    capability_key: checkout-and-payment
    requirement: >
      The system SHALL record each order with a user id, e-mail, date (epoch milliseconds), locale, total value (up to 12 digits with 2 decimals), and a mandatory contact record and payment card.
    confidence: high
    confidence_basis: DDL with comments in both files; the numeric type differs by dialect (see defects).
    risk_class: financial
    basis: purchase_order table.
    plain_text: Every order keeps who placed it, when, in which language, its total, and the contact and card used.
    technical_note: PURCHASE_ORDER PK po_id; po_date number(19)/bigint epoch ms; po_value number(12,2) in Oracle but double in Cloudscape. Indexes on po_user_id and po_date.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 144
        line_end: 157
        excerpt: |
          -- PURCHASE_ORDER: Order received by the Order Processing Center (OPC). PODATE is epoch milliseconds. POVALUE is the order total.
          CREATE TABLE purchase_order (
            po_id varchar2(40) not null,
            po_user_id varchar2(50) not null,
            po_email_id varchar2(120) not null,
            po_date number(19) not null,
      - path: legacy-source/db/schema/petstore_cloudscape.sql
        line_start: 144
        line_end: 157
        excerpt: "po_value double not null (Cloudscape)"
    stack_metadata:
      db.object: purchase_order, ix_po_user, ix_po_date
  - record_key: CART-BR-0001
    kind: business-rule
    capability_key: checkout-and-payment
    requirement: >
      The system SHALL require every order line to have a quantity greater than zero.
    confidence: high
    confidence_basis: CHECK constraint ck_po_line_qty in both DDL files and quantity NOT NULL.
    risk_class: operational
    basis: ALTER TABLE po_line_item ADD CONSTRAINT ck_po_line_qty CHECK (quantity > 0).
    plain_text: An order line must be for at least one unit.
    technical_note: Applies to po_line_item only; supplier_line_item has no equivalent quantity > 0 check.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 232
        line_end: 232
        excerpt: |
          ALTER TABLE po_line_item ADD CONSTRAINT ck_po_line_qty CHECK (quantity > 0);
    stack_metadata:
      db.object: po_line_item
  - record_key: FUL-ENT-0001
    kind: entity
    capability_key: order-fulfilment
    requirement: >
      The system SHALL store order lines keyed by order and line number, each with category, product, item, quantity, unit price (2 decimals) and quantity shipped, and SHALL NOT allow quantity shipped to exceed quantity.
    confidence: high
    confidence_basis: Composite key, FK and CHECK ck_po_line_shipped in DDL; comment says shipped quantity updated on supplier invoice.
    risk_class: operational
    basis: po_line_item and ck_po_line_shipped.
    plain_text: Each order line records how many units were ordered and shipped; shipped can never exceed ordered.
    technical_note: Only the order id has a foreign key; category_id, product_id, item_id are not constrained to the catalog. QUANTITYSHIPPED updated at supplier invoice.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 159
        line_end: 171
        excerpt: |
          -- PO_LINE_ITEM: Line of a purchase order. QUANTITYSHIPPED is updated when the supplier invoices.
          CREATE TABLE po_line_item (
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 233
        line_end: 233
        excerpt: |
          ALTER TABLE po_line_item ADD CONSTRAINT ck_po_line_shipped CHECK (quantity_shipped <= quantity);
    stack_metadata:
      db.object: po_line_item, ck_po_line_shipped
  - record_key: FUL-ENT-0002
    kind: entity
    capability_key: order-fulfilment
    requirement: >
      The system SHALL keep a supplier order per purchase order with a date, a status limited to PENDING or COMPLETED and a contact record, with its own order lines; and SHALL keep a non-negative stock quantity per item.
