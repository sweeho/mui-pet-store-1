    risk_class: operational
    basis: supplier_order, supplier_line_item, inventory and checks.
    plain_text: Orders sent to the supplier are either pending or completed, and stock levels can never go below zero.
    technical_note: SUPPLIER_ORDER PK po_id; INVENTORY PK item_id with CHECK quantity >= 0; supplier_line_item has no CHECK on quantity or shipped.
    interface: true
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 180
        line_end: 209
        excerpt: |
          CREATE TABLE supplier_order (
          ...
          CREATE TABLE inventory (
            item_id varchar2(10) not null,
            quantity integer not null,
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 235
        line_end: 236
        excerpt: |
          ALTER TABLE supplier_order ADD CONSTRAINT ck_supplier_order_status CHECK (po_status in ('PENDING','COMPLETED'));
          ALTER TABLE inventory ADD CONSTRAINT ck_inventory_qty CHECK (quantity >= 0);
    stack_metadata:
      db.object: supplier_order, supplier_line_item, inventory
