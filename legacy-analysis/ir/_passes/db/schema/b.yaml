  - record_key: APR-BR-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL restrict the processing status of an order to PENDING, APPROVED, DENIED or COMPLETED, with exactly one status per order.
    confidence: high
    confidence_basis: CHECK constraint, PK, comment, an index on status, and runbook/batch SQL using the same values.
    risk_class: operational
    basis: order_manager table and ck_order_manager_status.
    plain_text: An order is always in exactly one of four states: pending, approved, denied or completed.
    technical_note: ORDER_MANAGER(order_id PK, status). No FK from order_manager.order_id to purchase_order; view v_order_status joins them. Transitions are not constrained in the schema.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 173
        line_end: 178
        excerpt: |
          -- ORDER_MANAGER: OPC process manager state of an order. STATUS is PENDING, APPROVED, DENIED or COMPLETED.
          CREATE TABLE order_manager (
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 234
        line_end: 234
        excerpt: |
          ALTER TABLE order_manager ADD CONSTRAINT ck_order_manager_status CHECK (status in ('PENDING','APPROVED','DENIED','COMPLETED'));
    stack_metadata:
      db.object: order_manager, v_order_status
  - record_key: BAT-BR-0001
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      The system SHALL, on its weekly purge, delete orders in COMPLETED or DENIED status whose date is before the retention cutoff (180 days), together with their order lines, supplier orders and lines, status record, contact, address and payment card, and SHALL NOT purge PENDING or APPROVED orders.
    confidence: high
    confidence_basis: Purge SQL and runbook section 3.5 agree; 180 days also in the runbook configuration table.
    risk_class: regulated
    basis: order_purge.sql deletes in child-to-parent order inside one commit.
    plain_text: Once a week, finished or denied orders older than 180 days are erased along with their contact details and card; open orders are never erased.
    technical_note: Cutoff passed as :CUTOFF_MS; runs only after PS_ORDER_EXTRACT; single transaction (AUTOCOMMIT OFF, COMMIT). Customer account contact/card are not touched since only the order's own contact_id/card_id are removed.
    interface: false
    traces:
      - path: legacy-source/db/batch/order_purge.sql
        line_start: 1
        line_end: 26
        excerpt: |
          -- PS_ORDER_PURGE: delete COMPLETED and DENIED orders older than 180 days.
          WHERE m.status IN ('COMPLETED', 'DENIED') AND p.po_date < :CUTOFF_MS;
          DELETE FROM purchase_order     WHERE po_id IN (SELECT po_id FROM session.purge_po);
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        kind: document
        anchor: p1
        excerpt: "Sundays only. Deletes COMPLETED and DENIED orders older than 180 days ... PENDING and APPROVED orders are never purged."
    stack_metadata:
      batch.trigger: PS_ORDER_PURGE (Sundays)
      db.object: session.purge_po
  - record_key: BAT-BR-0002
    kind: business-rule
    capability_key: batch-operations
    requirement: >
      The system SHALL report orders still PENDING or APPROVED after 24 hours as STUCK, report a count of orders per status, and report orders whose supplier order is COMPLETED while the order status is not COMPLETED as MISMATCH.
    confidence: high
    confidence_basis: Batch SQL and runbook section 3.3 both describe the aging report.
    risk_class: operational
    basis: order_aging.sql three queries.
    plain_text: A daily report lists orders open for over a day, totals per state, and orders the supplier finished but the store never closed.
    technical_note: :CUTOFF_MS = now minus 24h in epoch ms; report rows start with STUCK / MISMATCH.
    interface: false
    traces:
      - path: legacy-source/db/batch/order_aging.sql
        line_start: 1
        line_end: 14
        excerpt: |
          -- PS_ORDER_AGING_REPORT: orders still PENDING or APPROVED after 24 hours.
          WHERE s.po_status = 'COMPLETED' AND m.status <> 'COMPLETED';
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        kind: document
        anchor: p1
        excerpt: "3.3 PS_ORDER_AGING_REPORT"
    stack_metadata:
      batch.trigger: PS_ORDER_AGING_REPORT (daily)
  - record_key: BAT-ENT-0003
    kind: entity
    capability_key: batch-operations
    requirement: >
      The system SHALL support both an Oracle and a Cloudscape/Derby database with the same table structure, the Cloudscape one being the runtime database and the Oracle one the reference production form.
    confidence: medium
    confidence_basis: Two files with same layout; runbook says Cloudscape/Derby runtime; Oracle labelled reference production in its own header only.
    risk_class: operational
    basis: Header comments of both DDL files; runbook stack description.
    plain_text: The data structure is defined for two database products with the same content.
    technical_note: Type differences - char vs varchar2 keys, smallint vs number(1), bigint vs number(19), double vs number(12,2).
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_cloudscape.sql
        line_start: 1
        line_end: 9
        excerpt: "-- Java Pet Store 1.3.2 database schema (Cloudscape 3.5 / Derby, runtime)"
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        kind: document
        anchor: p1
        excerpt: "DatabaseCloudscape (Apache Derby), database PetStoreDB in /var/petstore/db, schema ESTOREUSER."
    stack_metadata:
      db.object: petstore_oracle.sql, petstore_cloudscape.sql
suspected_defects:
  - capability_key: checkout-and-payment
    record_keys: [CHK-ENT-0002, FUL-ENT-0001]
    severity: high
    category: inconsistent-rounding
    title: Runtime database stores order totals and prices as floating point
    description: >
      Oracle DDL defines po_value and unit_price as fixed-point number(12,2); the Cloudscape runtime DDL defines them as double, while item_details list price stays decimal(10,2). Order money can accumulate binary rounding error at runtime.
    traces:
      - path: legacy-source/db/schema/petstore_cloudscape.sql
        line_start: 150
        line_end: 150
        excerpt: "po_value double not null,"
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 152
        line_end: 152
        excerpt: "po_value number(12,2) not null,"
  - capability_key: customer-accounts
    record_keys: [ACC-ENT-0001, CHK-ENT-0001]
    severity: high
    category: other
    title: Passwords and card numbers stored in clear text
    description: >
      Sign-on passwords and card numbers are stored unencrypted; the DDL comments state this explicitly.
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 72
        line_end: 72
        excerpt: "-- SIGNON_USER: ... PASSWORD is plain text."
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 103
        line_end: 103
        excerpt: "-- CREDIT_CARD: Payment card. CARDNUMBER is stored in clear."
  - capability_key: order-fulfilment
    record_keys: [FUL-ENT-0002, APR-BR-0001]
    severity: low
    category: data-corruption
    title: Missing referential and check constraints on order tables
    description: >
      order_manager.order_id has no foreign key to purchase_order; po_line_item and supplier_line_item item/product/category ids have no foreign key to the catalog; supplier_line_item lacks the quantity checks that po_line_item has. Orphan or invalid rows are possible.
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 173
        line_end: 202
        excerpt: "order_manager and supplier_line_item definitions without those constraints"
findings: []
